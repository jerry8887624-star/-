<html lang="zh-Hant">

<meta name="theme-color" content="#e6ebe5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1614" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>觀象閣</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone-width column (max 560px) like a pocket almanac; sticky title bar, fixed bottom tab bar of seal-stamp glyphs. */
:root{
  --paper:#e6ebe5;      /* celadon-grey ground */
  --surface:#f5f7f3;
  --surface-2:#edf1ec;
  --ink:#1b2321;
  --muted:#5a6964;
  --line:#c8d1ca;
  --seal:#b23a2b;       /* cinnabar seal, the one accent */
  --seal-ink:#fff7f2;
  --brass:#8a6a2c;
  --good:#2f7a5f; --mid:#9a6a12; --bad:#a0383a;
  --wood:#3d7a4f; --fire:#c0482e; --earth:#9a6a12; --metal:#6f7884; --water:#2e5f8a;
  --lu:#2f7a5f; --quan:#b23a2b; --ke:#2e5f8a; --ji:#6b4a7a;
  --shadow:0 1px 2px rgba(27,35,33,.06),0 6px 18px rgba(27,35,33,.06);
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1614;--surface:#18211e;--surface-2:#1e2925;--ink:#e3e9e4;--muted:#93a39c;--line:#2d3a35;
  --seal:#e0644f;--seal-ink:#1a0d0a;--brass:#c9a65f;
  --good:#6cc29e;--mid:#d9a845;--bad:#ec7f7a;
  --wood:#79c08a;--fire:#ef7b5f;--earth:#d9a845;--metal:#aab4bf;--water:#77a9d6;
  --lu:#6cc29e;--quan:#ef7b5f;--ke:#77a9d6;--ji:#c49bd6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1614;--surface:#18211e;--surface-2:#1e2925;--ink:#e3e9e4;--muted:#93a39c;--line:#2d3a35;
  --seal:#e0644f;--seal-ink:#1a0d0a;--brass:#c9a65f;
  --good:#6cc29e;--mid:#d9a845;--bad:#ec7f7a;
  --wood:#79c08a;--fire:#ef7b5f;--earth:#d9a845;--metal:#aab4bf;--water:#77a9d6;
  --lu:#6cc29e;--quan:#ef7b5f;--ke:#77a9d6;--ji:#c49bd6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.seal{width:34px;height:34px;border-radius:6px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:700;flex:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--seal-ink) 35%,transparent)}
.brand h1{font-size:21px;letter-spacing:.08em}
.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;font-family:var(--f-body);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;max-width:50%}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;border:1px solid var(--line)}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.who:focus-visible,.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.cell:focus-visible,.yr:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* generic blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.h2{font-size:22px}
.h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin-block:4px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;border:1px dashed var(--seal);color:var(--ink);background:color-mix(in srgb,var(--seal) 7%,var(--surface));font-size:14px}
.banner b{color:var(--seal)}
.banner .btn{white-space:nowrap;flex:none}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.pill.good{color:var(--good)}.pill.mid{color:var(--mid)}.pill.bad{color:var(--bad)}
.el{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:700;color:var(--surface);flex:none}
.el.e0{background:var(--wood)}.el.e1{background:var(--fire)}.el.e2{background:var(--earth)}.el.e3{background:var(--metal)}.el.e4{background:var(--water)}
.t0{color:var(--wood)}.t1{color:var(--fire)}.t2{color:var(--earth)}.t3{color:var(--metal)}.t4{color:var(--water)}

/* meter: five ticks */
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--seal)}
.meter.big i{width:22px;height:8px}

/* field */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:16px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:72px;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--seal);outline-offset:0;border-color:transparent}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;cursor:pointer;color:var(--muted);font-size:11px;letter-spacing:.06em}
.tab b{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;font-weight:700;border:1.5px solid currentColor;transition:all .2s}
.tab[aria-current="page"]{color:var(--seal)}
.tab[aria-current="page"] b{background:var(--seal);color:var(--seal-ink);border-color:var(--seal)}

/* overview: four pillars */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.pillar{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.pillar .lb{font-size:11px;color:var(--muted);letter-spacing:.1em}
.pillar .gz{font-family:var(--f-display);font-size:26px;line-height:1.15;display:flex;flex-direction:column;align-items:center;margin-block:2px}
.pillar .ss{font-size:11px;color:var(--muted)}
.pillar.dm{border-color:var(--seal)}
.wxbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.wxbar span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stat .v{font-family:var(--f-display);font-size:20px;line-height:1.3}
.stat .s{font-size:12px;color:var(--muted)}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.yiji{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.yiji b{font-family:var(--f-display);width:26px;height:26px;display:grid;place-items:center;border-radius:6px;font-size:15px}
.yiji .y{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.yiji .j{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* hexagram */
.hexes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.hex{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.hex .tag{font-size:11px;color:var(--muted);letter-spacing:.12em}
.hex .nm{font-family:var(--f-display);font-size:18px;line-height:1.2}
.hex .full{font-size:12px;color:var(--muted)}
.lines{display:flex;flex-direction:column-reverse;gap:6px;width:72px}
.ln{height:9px;display:flex;gap:12px;position:relative}
.ln span{flex:1;background:var(--ink);border-radius:2px}
.ln.mv span{background:var(--seal)}
.ln .mk{position:absolute;right:-18px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--seal);line-height:1}
.hex.main .lines{width:84px}
.hex.main .ln{height:11px}
.yao{display:flex;flex-direction:column-reverse;gap:6px;min-height:120px;justify-content:flex-start}
.yao-row{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;gap:10px;font-size:13px;animation:rise .35s ease both}
.yao-row .bar{height:10px;display:flex;gap:14px}
.yao-row .bar span{flex:1;background:var(--ink);border-radius:2px}
.yao-row.mv .bar span{background:var(--seal)}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.coins{display:flex;gap:16px;justify-content:center;padding-block:8px;perspective:600px}
.coin{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--brass) 55%,var(--surface)),var(--brass));border:2px solid color-mix(in srgb,var(--brass) 70%,var(--ink));position:relative;display:grid;place-items:center;color:var(--surface);font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.05em;transform-style:preserve-3d}
.coin::after{content:"";position:absolute;width:16px;height:16px;border:2px solid color-mix(in srgb,var(--brass) 60%,var(--ink));background:var(--paper);left:50%;top:50%;transform:translate(-50%,-50%)}
.coin .t{position:absolute;inset:0}
.coin .t i{position:absolute;font-style:normal}
.coin .t i:nth-child(1){top:5px}.coin .t i:nth-child(2){bottom:5px}.coin .t i:nth-child(3){left:7px}.coin .t i:nth-child(4){right:7px}
.coin.flip{animation:flip .7s ease-out}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(540deg) translateY(-26px)}100%{transform:rotateY(1080deg) translateY(0)}}
.ritual{font-size:13px;color:var(--muted);border-left:3px solid var(--seal);padding-left:10px}
.quote{font-family:var(--f-display);font-size:17px;line-height:1.7;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.reader{display:flex;gap:12px;align-items:flex-start}
.reader .seal{width:30px;height:30px;font-size:16px}
.reader p{flex:1;min-width:0}
.hist{display:flex;flex-direction:column}
.hist button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;cursor:pointer}
.hist button:first-child{border-top:0}
.hist .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ziwei board */
.board-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,auto);gap:3px;min-width:340px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 5px 4px;min-height:118px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;position:relative;min-width:0}
.cell.sel{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal)}
.cell.sf{background:color-mix(in srgb,var(--seal) 6%,var(--surface))}
.cell .maj{display:flex;flex-direction:column;gap:0;font-family:var(--f-display);font-size:14px;line-height:1.25}
.cell .maj em{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--f-body)}
.mu{display:inline-block;font-size:10px;line-height:1;padding:2px 3px;border-radius:3px;color:var(--surface);margin-left:2px;vertical-align:1px;font-family:var(--f-body);font-weight:700}
.mu.祿{background:var(--lu)}.mu.權{background:var(--quan)}.mu.科{background:var(--ke)}.mu.忌{background:var(--ji)}
.mu.ly{outline:1.5px dashed var(--ink);outline-offset:-1px}
.cell .min{font-size:10.5px;color:var(--muted);line-height:1.3;word-break:break-all}
.cell .min .g{color:var(--good)}.cell .min .b{color:var(--bad)}
.cell .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:2px}
.cell .pn{font-size:12.5px;font-weight:700}
.cell.ming .pn{color:var(--seal)}
.cell .gz{font-size:10px;color:var(--muted);text-align:right;line-height:1.2}
.cell .ln-tag{align-self:flex-start;font-size:9.5px;padding:0 4px;border-radius:4px;background:var(--ink);color:var(--paper);line-height:1.5}
.cell .body-tag{font-size:9.5px;color:var(--seal);border:1px solid var(--seal);border-radius:3px;padding:0 2px;margin-left:2px}
.center{grid-column:2 / span 2;grid-row:2 / span 2;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;justify-content:center;text-align:center;font-size:12px;min-width:0}
.center .nm{font-family:var(--f-display);font-size:20px}

/* liunian */
.years{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.yr{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:center;cursor:pointer;min-width:74px}
.yr .y{font-size:12px;color:var(--muted)}
.yr .g{font-family:var(--f-display);font-size:19px;line-height:1.3}
.yr[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.yr[aria-pressed="true"] .y{color:inherit;opacity:.75}
.yr .meter i{width:8px;height:4px}
.yr[aria-pressed="true"] .meter i{background:color-mix(in srgb,var(--paper) 30%,transparent)}
.yr[aria-pressed="true"] .meter i.on{background:var(--seal)}
.dayun{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dy{flex:none;width:62px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px;background:var(--surface-2)}
.dy.on{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 8%,var(--surface))}
.dy .g{font-family:var(--f-display);font-size:18px;line-height:1.2}
.dy .a{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
svg text{font-family:var(--f-body)}

/* name */
.namegrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ch{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.ch .c{font-family:var(--f-display);font-size:34px;line-height:1;width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.ch.v .c{color:var(--muted);border-style:dashed;font-size:22px}
.ch input{width:56px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface);font-variant-numeric:tabular-nums}
.ch small{font-size:11px;color:var(--muted)}
.gridlist{display:flex;flex-direction:column}
.ge{display:grid;grid-template-columns:52px 46px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ge:first-child{border-top:0}
.ge .lb{font-family:var(--f-display);font-size:16px}
.ge .lb small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);line-height:1.2}
.ge .n{font-size:22px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ge .d{font-size:13px;min-width:0}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-variant-numeric:tabular-nums}
.ring b small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:-30px}

/* qimen */
.qm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:104px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;gap:2px;font-size:12px;position:relative;min-width:0}
.qc .god{grid-column:1;color:var(--muted)}
.qc .hs{grid-column:2;text-align:right;font-weight:700}
.qc .mid{grid-column:1 / span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);line-height:1.25}
.qc .mid .st{font-size:14px}
.qc .mid .dr{font-size:18px}
.qc .pal{grid-column:1;color:var(--muted);font-size:11px}
.qc .es{grid-column:2;text-align:right;color:var(--muted)}
.qc.use{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal)}
.qc.best{background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.qc .flag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;padding:0 6px;border-radius:6px;background:var(--seal);color:var(--seal-ink);white-space:nowrap}
.qc .flag.g{background:var(--good);color:var(--surface)}
.qc .kong{font-size:10px;color:var(--bad)}
.qc.c5{background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}.mid-t{color:var(--mid)}

/* sheet */
.sheet-back{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30;pointer-events:none}
.yaolist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.yaolist li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.yaolist li:first-child{border-top:0}
.yaolist li.hl{background:color-mix(in srgb,var(--seal) 7%,transparent);border-radius:8px;padding-inline:6px}
.yaolist .yc{font-family:var(--f-display);font-size:15.5px}
.mvtag{font-size:10px;color:var(--seal-ink);background:var(--seal);border-radius:4px;padding:0 4px;font-family:var(--f-body)}
.catgrid{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.catrow{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.catrow:first-child{border-top:0}
.catrow.on{background:color-mix(in srgb,var(--seal) 8%,var(--surface))}
.catrow b{font-size:13px}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.help{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;background:var(--surface-2)}
.help summary{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.help summary::after{content:"＋";color:var(--seal)}
.help[open] summary::after{content:"－"}
.help p{margin-top:8px;font-size:14px;line-height:1.75}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);white-space:nowrap;font-size:13px}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl-wrap{overflow-x:auto}
.cand{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.cand:first-child{border-top:0}
.cand .nm{font-family:var(--f-display);font-size:24px;line-height:1.2}
.cand .sc{font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.cand .meta{grid-column:1 / -1;font-size:13px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.cand .acts{grid-column:1 / -1;display:flex;gap:8px}
.chip.el-chip[aria-pressed="true"]{color:var(--surface)}
.qc{cursor:pointer;text-align:left;font:inherit;color:inherit}
.qc.sel{outline:2px solid var(--ink);outline-offset:1px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-block:18px 0}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* ---- motion & polish ---- */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--r:18px}
.top{transition:box-shadow .3s var(--ease),background .3s}
.top.scrolled{box-shadow:0 8px 24px -16px rgba(0,0,0,.35);background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn,.chip,.tile,.tab,.cell,.qc,.yr,.day,.check,.nx,.who,.seg button{transition:transform .25s var(--spring),background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,.tile:active,.cell:active,.qc:active,.yr:active,.day:active,.check:active,.nx:active,.who:active{transform:scale(.96)}
.tab:active b{transform:scale(.88)}
@media (hover:hover){.tile:hover,.nx:hover,.yr:hover,.day:hover{border-color:color-mix(in srgb,var(--seal) 40%,var(--line))}.card{transition:box-shadow .3s var(--ease)}}
.view>*{animation:rise-in .5s var(--ease) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise-in{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
::view-transition-old(root){animation:vt-out .18s var(--ease) both}
::view-transition-new(root){animation:vt-in .32s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(8px)}}
.tabbar nav{position:relative}
.tab-ind{position:absolute;top:6px;left:0;width:calc(100% / 6);height:44px;pointer-events:none;transition:transform .45s var(--spring)}
.tab-ind::before{content:"";position:absolute;inset:0 18%;border-radius:14px;background:color-mix(in srgb,var(--seal) 10%,transparent)}
.tab{position:relative;z-index:1}
.tab b{transition:transform .3s var(--spring),background .3s,color .3s,border-color .3s}
.tab[aria-current="page"] b{transform:translateY(-2px)}
.sheet-back{animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{animation:up .42s var(--spring)}
.toast{animation:toast .35s var(--spring)}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px) scale(.95)}}
details[open]>summary~*{animation:rise-in .35s var(--ease)}

/* ---- 每日運勢 ---- */
.daily{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--seal) 12%,transparent),transparent 60%),var(--surface);border-color:color-mix(in srgb,var(--seal) 22%,var(--line))}
.daily .h2{font-size:24px}
.dial-wrap{position:relative;width:112px;height:112px;flex:none}
.dial{width:100%;height:100%}
.dial .arc{animation:arc 1s var(--ease) both}
@keyframes arc{from{stroke-dasharray:0 var(--c)}to{stroke-dasharray:var(--len) var(--c)}}
.dial-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dial-num b{font-family:var(--f-display);font-size:34px;font-weight:700}
.dial-num span{font-size:12px;color:var(--seal);letter-spacing:.2em;margin-top:4px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}
.day .w{font-size:10.5px;color:var(--muted);white-space:nowrap}
.day .d{font-size:17px;font-weight:700}
.day i{display:block;width:60%;height:3px;border-radius:2px;margin-top:3px;background:linear-gradient(90deg,var(--seal) calc((var(--s) - 30) * 1.5%),var(--line) 0)}
.day.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day.on .w{color:inherit;opacity:.7}
.lead{font-family:var(--f-display);font-size:18px;line-height:1.6}
.areas{display:flex;flex-direction:column;gap:9px}
.area{display:grid;grid-template-columns:40px 1fr 32px;gap:10px;align-items:center;font-size:14px}
.ab{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.ab i{display:block;height:100%;width:var(--w);border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--seal) 55%,var(--brass)),var(--seal));transform-origin:left;animation:grow .9s var(--ease) both}
.area:nth-child(2) .ab i{animation-delay:.06s}.area:nth-child(3) .ab i{animation-delay:.12s}.area:nth-child(4) .ab i{animation-delay:.18s}.area:nth-child(5) .ab i{animation-delay:.24s}
@keyframes grow{from{transform:scaleX(0)}}
.av{text-align:right;font-weight:700}
.lucky{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lucky>div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lucky .k{font-size:11px;color:var(--muted)}
.lucky .v{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:11px;height:11px;border-radius:50%;flex:none}
.sw.e0{background:var(--wood)}.sw.e1{background:var(--fire)}.sw.e2{background:var(--earth)}.sw.e3{background:var(--metal)}.sw.e4{background:var(--water)}
.swap-l{animation:swap-l .45s var(--ease) both}.swap-r{animation:swap-r .45s var(--ease) both}
@keyframes swap-l{from{opacity:.2;transform:translateX(24px)}}
@keyframes swap-r{from{opacity:.2;transform:translateX(-24px)}}
@media (max-width:400px){.lucky{grid-template-columns:repeat(2,1fr)}.dial-wrap{width:96px;height:96px}.dial-num b{font-size:28px}}

/* ---- 行動指南 ---- */
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;font-size:14px;line-height:1.6}
.check .ct b{display:inline-block;margin-right:8px;font-family:var(--f-display);color:var(--seal);font-size:15px}
.check .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);margin-top:1px;position:relative;transition:all .3s var(--spring)}
.check .box::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--seal-ink);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .3s var(--spring)}
.check.on{background:color-mix(in srgb,var(--good) 8%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.check.on .box{background:var(--good);border-color:var(--good);transform:scale(1.08)}
.check.on .box::after{transform:rotate(45deg) scale(1)}
.check.on .ct{color:var(--muted)}
.next{display:flex;flex-direction:column;gap:8px}
.nx{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.nx b{font-size:15px}
.nx span{font-size:13px;color:var(--seal)}

@media (max-width:380px){.cell{min-height:108px}.cell .maj{font-size:13px}.tab{font-size:10px}.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand"><div class="seal" aria-hidden="true">觀</div><div style="min-width:0"><h1>觀象閣</h1><small id="todayLine">　</small></div></div>
    <button class="who" id="whoBtn" aria-label="編輯命主資料"><span class="av" id="whoAv">命</span><span id="whoName">命主</span></button>
  </header>

  <main>
    <div id="boot" class="loading">正在排盤…</div>

    <!-- 總覽 -->
    <section class="view stack" id="v-overview" hidden></section>
    <!-- 易經 -->
    <section class="view stack" id="v-yijing" hidden>
      <div id="yjHelp"></div>
      <div class="card stack">
        <div><div class="eyebrow">易經占卜</div><h2 class="h2">一事一占，帶著問題起卦</h2></div>
        <label class="f" for="yjQ">你想問的事
          <textarea id="yjQ" placeholder="例：下個月換工作是否順利？" maxlength="80"></textarea></label>
        <div class="chips" id="yjCats" role="group" aria-label="問事類別"></div>
        <div class="seg" id="yjMethod" role="group" aria-label="起卦方式">
          <button type="button" data-m="coin" aria-pressed="true">銅錢六擲</button>
          <button type="button" data-m="time" aria-pressed="false">時間起卦</button>
          <button type="button" data-m="num" aria-pressed="false">報數起卦</button>
        </div>
        <div id="yjPanel"></div>
      </div>
      <div id="yjResult" class="stack"></div>
      <div class="card" id="yjHistCard"><div class="row between"><h3 class="h3">占卜紀錄</h3><button class="btn sm ghost" id="yjClear" type="button">清除</button></div><div class="hist" id="yjHist"></div></div>
    </section>
    <!-- 紫微 -->
    <section class="view stack" id="v-ziwei" hidden></section>
    <!-- 流年 -->
    <section class="view stack" id="v-liunian" hidden></section>
    <!-- 姓名 -->
    <section class="view stack" id="v-name" hidden></section>
    <!-- 奇門 -->
    <section class="view stack" id="v-qimen" hidden></section>

    <p class="foot">命理是看清自己的一面鏡子，結果僅供參考；重大決定請回到現實條件綜合判斷。</p>
  </main>
</div>

<div class="tabbar"><nav aria-label="功能">
  <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
  <button class="tab" data-v="overview"><b>總</b>總覽</button>
  <button class="tab" data-v="yijing"><b>易</b>易經</button>
  <button class="tab" data-v="ziwei"><b>紫</b>紫微</button>
  <button class="tab" data-v="liunian"><b>年</b>流年</button>
  <button class="tab" data-v="name"><b>名</b>姓名</button>
  <button class="tab" data-v="qimen"><b>奇</b>奇門</button>
</nav></div>

<div class="sheet-back" id="sheetBack" hidden>
  <form class="sheet" id="pForm" autocomplete="off">
    <div class="grab"></div>
    <div><div class="eyebrow">命主資料</div><h2 class="h2">輸入生辰，排出你的命盤</h2></div>
    <div class="grid2">
      <label class="f" for="pSur">姓<input id="pSur" maxlength="2" required placeholder="林"></label>
      <label class="f" for="pGiven">名<input id="pGiven" maxlength="3" required placeholder="書言"></label>
    </div>
    <div class="f"><span>性別</span><div class="seg" id="pGender" role="group" aria-label="性別"><button type="button" data-g="男">男（乾造）</button><button type="button" data-g="女">女（坤造）</button></div></div>
    <label class="f" for="pDate">國曆生日<input id="pDate" type="date" min="1900-01-01" max="2099-12-31" required></label>
    <label class="f" for="pHour">出生時辰<select id="pHour"></select></label>
    <p class="small muted">資料只存在這台裝置的瀏覽器裡，不會上傳。不確定時辰時，紫微與時柱僅能參考。</p>
    <div class="grid2"><button type="button" class="btn" id="pCancel">取消</button><button type="submit" class="btn primary">排盤</button></div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

{x:'天與火，同人；君子以類族辨物。',c:['利團隊合作、跨部門專案與公開競選；公私分明最重要。','合資、團購、共同投資有利，但帳目要透明。','因共同興趣而結緣，朋友變戀人的機會大。','與朋友一起運動，心情與體能都會提升。','結伴出行吉，可參加團體活動或聚會。'],

{x:'地中有山，謙；君子以裒多益寡，稱物平施。',c:['低調踏實會被看見，適合請教前輩、默默累積；功勞讓給團隊反得人心。','收入穩定，量入為出；不炫富則財可久。','以謙和打動對方，關係穩定長久。','體質平穩，宜清淡飲食與規律作息。','出行平安，宜低調。'],

{x:'澤中有雷，隨；君子以嚮晦入宴息。',c:['跟隨有能力的主管或順應市場趨勢最有利；不宜自立門戶。','跟著趨勢穩健操作，勿逆勢。','順著對方的節奏，關係會更和諧；但要選對人。','作息配合自然，晚上早點休息。','隨遇而安，臨時改行程也無妨。'],

{x:'山下有風，蠱；君子以振民育德。',c:['接手爛攤子或需要整頓舊制度，下定決心改革反成轉機。','清理舊帳、處理呆帳的時候，止血比求財重要。','關係中積壓的問題浮現，坦白處理才有未來。','注意舊疾復發、腸胃與感染，定期檢查。','出行前檢查車況與行李，避免舊問題作怪。'],

{x:'澤上有地，臨；君子以教思无窮，容保民无疆。',c:['好機會接近，適合主動接案、晉升管理職；親自督導最有效。','財運上升，但要留意後段轉折，賺到要守。','感情升溫，適合主動靠近；保持真誠。','體力上升，但留意季節轉換時的感冒。','出行有收穫，利拜訪與視察。'],

{x:'風行地上，觀；先王以省方觀民設教。',c:['適合觀察、研究與規劃，暫不做重大決策；考試宜多看題型。','先觀望市場，不急於進場。','彼此還在觀察階段，多了解對方的價值觀。','注意眼睛與神經疲勞，適度休息。','適合考察、參觀、旅遊增廣見聞。'],

{x:'山下有火，賁；君子以明庶政，无敢折獄。',c:['利包裝、設計、品牌與簡報；小事可成，大案要看實力。','花費在形象上可，但勿虛榮過度。','外在吸引力強，但需更多實質了解。','注意皮膚與美容保養，別過度。','適合短程旅遊、拍照、藝文活動。'],

{x:'澤滅木，大過；君子以獨立不懼，遯世无悶。',c:['工作量超載、責任過重，要分工求援；非常手段可用，但別硬撐。','財務壓力大，避免高風險與過度擴張。','關係中有一方付出過多或年齡差距大，需重新平衡。','過勞警訊，注意腰背、骨骼與心臟。','避免危險活動與涉水。'],

{x:'水洊至，習坎；君子以常德行，習教事。',c:['困難重重，一關接一關；靠專業與誠信一步步過，不宜冒險換跑道。','財有陷阱，嚴防詐騙與高風險投資。','感情有隱憂或不安全感，坦誠溝通、別猜疑。','注意腎臟、泌尿、血液循環與情緒低落。','避免涉水、夜行與危險地點。'],
y:[['習坎，入于坎窞，凶。','落入深坑中的深坑，凶。'],['坎有險，求小得。','身處險中，只求小有所得。'],['來之坎坎，險且枕，入于坎窞，勿用。','進退皆險，不可輕舉妄動。'],['樽酒簋貳，用缶，納約自牖，終无咎。','以簡樸真誠的方式從窗口結約，終無咎。'],['坎不盈，祇既平，无咎。','坑還沒滿，但快要平了，無咎。'],['係用徽纆，寘于叢棘，三歲不得，凶。','被繩索捆綁丟進荊棘，久困不出，凶。']]},
{x:'明兩作，離；大人以繼明照于四方。',c:['利曝光、簡報、文書、考試與創意工作；依附好的平台或主管更能發光。','靠專業與名聲帶財，文化、傳媒類有利。','熱情吸引對方，但要避免一頭熱與佔有慾。','注意心臟、眼睛與上火，作息要規律。','利向南方，適合白天出行。'],
y:[['履錯然，敬之无咎。','起步時腳步雜亂，保持恭敬則無咎。'],['黃離，元吉。','黃色的光，中正之明，大吉。'],['日昃之離，不鼓缶而歌，則大耋之嗟，凶。','夕陽西下，不能安然自樂則徒嘆老之將至，凶。'],['突如其來如，焚如，死如，棄如。','突如其來、來勢洶洶，必遭摒棄。'],['出涕沱若，戚嗟若，吉。','憂懼流淚、深自警惕，吉。'],['王用出征，有嘉折首，獲匪其醜，无咎。','出征除首惡、不濫殺，無咎。']]},
{x:'山上有澤，咸；君子以虛受人。',c:['與同事、客戶默契好，適合談合作；靠真誠打動人。','因人際關係帶財，合作案有利。','心動、互相吸引的好卦，適合告白、交往與婚嫁。','情緒影響身體，保持心情愉快。','出行可能有浪漫邂逅。'],
y:[['咸其拇。','感應在腳趾，動念尚淺。'],['咸其腓，凶，居吉。','感應在小腿，急於行動則凶，安居則吉。'],['咸其股，執其隨，往吝。','感應在大腿，盲目跟隨他人，有憾。'],['貞吉悔亡，憧憧往來，朋從爾思。','守正則吉；心意不定往來，朋友會順從你的想法。'],['咸其脢，无悔。','感應在背肉，雖不深但無悔。'],['咸其輔頰舌。','只在口舌上感應，流於空談。']]},
{x:'雷風，恆；君子以立不易方。',c:['持之以恆的耕耘最有利，不宜頻繁跳槽或換方向。','長期投資、定存定投有利。','關係穩定長久，適合談婚姻與承諾。','慢性病需長期調養，持續運動。','固定路線、常去的地方較順。'],
y:[['浚恆，貞凶，无攸利。','一開始就求之過深，凶。'],['悔亡。','悔恨消失。'],['不恆其德，或承之羞，貞吝。','不能持守德行，將蒙受羞辱。'],['田无禽。','打獵無所獲，方向不對。'],['恆其德，貞，婦人吉，夫子凶。','恆守柔順之德，宜順從不宜主導。'],['振恆，凶。','躁動不安、不能持恆，凶。']]},
{x:'天下有山，遯；君子以遠小人，不惡而嚴。',c:['形勢對你不利，適合暫退、休假、轉調或保留實力。','見好就收、獲利了結，避免逆勢加碼。','保持距離反而好，勿強求。','需要休息與遠離壓力源。','適合遠行避開紛擾，散心。'],

{x:'雷在天上，大壯；君子以非禮弗履。',c:['實力強、聲勢旺，可以爭取更大舞台；但不可盛氣凌人。','財運旺，可進取，但勿衝動投機。','魅力強，但過於強勢會嚇跑對方。','體力好，注意運動傷害與肝火。','出行順利，但小心超速與衝動。'],
y:[['壯于趾，征凶，有孚。','力量在腳趾就急著前進，凶。'],['貞吉。','守正則吉。'],['小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。','小人逞強，君子不用；公羊撞籬笆卡住了角。'],['貞吉悔亡，藩決不羸，壯于大輿之輹。','守正則吉，阻礙打開，力量運用得宜。'],['喪羊于易，无悔。','在田邊丟了羊，放下剛強，無悔。'],['羝羊觸藩，不能退，不能遂，无攸利，艱則吉。','進退不得，無所利；能以艱難自處則吉。']]},
{x:'明出地上，晉；君子以自昭明德。',c:['升遷、加薪、獲獎、被看見的好卦；主動表現。','收入提升，事業帶財。','關係進展，可見家長、公開關係。','精神好，白天活動有益。','利出差與拜訪，路途順暢。'],

{x:'明入地中，明夷；君子以蒞眾，用晦而明。',c:['才華被埋沒或受打壓，宜低調、不鋒芒畢露，暗中準備。','財運受阻，防小人與受騙。','關係中有委屈或不被理解，先照顧好自己。','注意眼睛、心情低落與外傷。','夜行與偏僻處要小心。'],
y:[['明夷于飛，垂其翼。君子于行，三日不食。有攸往，主人有言。','光明受傷時低飛垂翼，避禍遠行，雖受責難也要走。'],['明夷，夷于左股，用拯馬壯，吉。','傷了左腿，借助強壯的馬救援，吉。'],['明夷于南狩，得其大首，不可疾貞。','南征捕獲首惡，但不可操之過急。'],['入于左腹，獲明夷之心，于出門庭。','深入了解黑暗的內情，然後離開。'],['箕子之明夷，利貞。','如箕子般韜光養晦，守正則利。'],['不明晦，初登于天，後入于地。','不明而晦暗，先高升後墜落。']]},
{x:'風自火出，家人；君子以言有物而行有恆。',c:['先把團隊內部分工理清，家族企業或內勤工作有利。','家庭理財、房產有利，宜由一人統籌。','家庭和睦，適合成家、同居或拜見家人。','居家調養，注意飲食衛生。','以家庭旅遊為佳。'],
y:[['閑有家，悔亡。','一開始就立好家規，悔恨消失。'],['无攸遂，在中饋，貞吉。','不擅自作主，專心照顧家務，守正吉。'],['家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。','治家過嚴雖有悔而吉，過於放縱終有憾。'],['富家，大吉。','使家富裕，大吉。'],['王假有家，勿恤，吉。','以德感化家人，不必憂慮，吉。'],['有孚威如，終吉。','誠信而有威嚴，終吉。']]},
{x:'上火下澤，睽；君子以同而異。',c:['意見分歧、合作不順，大案難成，先處理小事；求同存異。','合夥易有分歧，帳目分清。','價值觀不同、易誤會，先釐清期待。','注意肝膽與情緒對立造成的壓力。','與人同行易起摩擦，各自安排較好。'],
y:[['悔亡，喪馬勿逐，自復；見惡人，无咎。','丟了馬不必追，自會回來；見到不喜歡的人也無咎。'],['遇主于巷，无咎。','在巷中偶遇主人，非正式管道也能相合，無咎。'],['見輿曳，其牛掣，其人天且劓，无初有終。','車被拖、牛受阻，起初不順，終有好結果。'],['睽孤，遇元夫，交孚，厲无咎。','孤立時遇到良友，以誠相交，雖危無咎。'],['悔亡，厥宗噬膚，往何咎。','悔恨消失，同宗親近容易相合，前往無咎。'],['睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。','因猜疑看錯一切；誤會解開後才知是求合者，遇雨則吉。']]},
{x:'山上有水，蹇；君子以反身修德。',c:['推進困難，宜停下反省，找人幫忙；往西南（平順處）發展較好。','財務吃緊，先求穩，不宜擴張。','關係遇到阻礙或遠距，耐心處理。','注意腿腳、關節與行動不便。','行路艱難，能延期就延期。'],
y:[['往蹇，來譽。','前往有難，回來反得讚譽。'],['王臣蹇蹇，匪躬之故。','為公事奔波受苦，並非為了自己。'],['往蹇，來反。','前往有難，不如回來。'],['往蹇，來連。','前往有難，回來聯合同伴。'],['大蹇，朋來。','大難之中有朋友來助。'],['往蹇，來碩，吉，利見大人。','前往有難，回來可有大成，吉，宜見貴人。']]},
{x:'雷雨作，解；君子以赦過宥罪。',c:['卡住的事情鬆動、問題解決，宜快刀斬亂麻。','債務、資金壓力紓解。','誤會冰釋，關係回暖；放下過去。','病情好轉，壓力解除。','出行解悶有益，宜早出發。'],
y:[['无咎。','無咎。'],['田獲三狐，得黃矢，貞吉。','打獵獲三狐並得黃箭，除去小人，守正吉。'],['負且乘，致寇至，貞吝。','背著東西又乘車，招搖招盜，有憾。'],['解而拇，朋至斯孚。','擺脫小人的糾纏，真朋友就會到來。'],['君子維有解，吉，有孚于小人。','君子能解除困難，吉，小人也會信服。'],['公用射隼于高墉之上，獲之，无不利。','射下高牆上的猛隼，除去大患，無不利。']]},
{x:'山下有澤，損；君子以懲忿窒欲。',c:['先投入後收穫，適合做基礎建設、員工訓練；短期看似吃虧。','支出增加，但是有價值的投資；控制慾望性消費。','願意為對方付出，感情加深；別計較。','減重、斷食、戒除壞習慣的好時機。','花費較多，但值得。'],

{x:'風雷，益；君子以見善則遷，有過則改。',c:['得到資源與助力，適合大膽擴張、轉職與新計畫。','財運大好，投資與收入皆有增益。','互相成就的關係，感情升溫。','元氣充足，適合開始新的健康計畫。','利出行、遷移與搬家。'],
y:[['利用為大作，元吉，无咎。','適合做大事，大吉無咎。'],['或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。','得到大的助益，長久守正則吉。'],['益之用凶事，无咎。有孚中行，告公用圭。','在困難時得到助益，誠信中正地稟報，無咎。'],['中行，告公從，利用為依遷國。','行中道，建議被採納，適合遷移與變動。'],['有孚惠心，勿問元吉。有孚惠我德。','真心施惠，不用問也知大吉，他人感念你的德。'],['莫益之，或擊之，立心勿恆，凶。','沒人幫助反遭攻擊，心不能持恆，凶。']]},
{x:'澤上於天，夬；君子以施祿及下，居德則忌。',c:['該做決斷了，公開表態、處理問題人物；但要講究方法。','果斷停損或出場。','該攤牌了，明確說出你的想法。','注意急躁與肺部、呼吸道。','行程果斷決定，勿拖延。'],
y:[['壯于前趾，往不勝為咎。','只有腳尖有力就前進，不能勝任反有咎。'],['惕號，莫夜有戎，勿恤。','時時警惕呼號，即使夜間有敵也不必擔憂。'],['壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。','怒形於色有凶；果決獨行即使被誤解，無咎。'],['臀无膚，其行次且。牽羊悔亡，聞言不信。','坐立不安、行動遲疑；聽從勸告則悔亡，但聽不進去。'],['莧陸夬夬，中行无咎。','果決地除去禍根，行中道無咎。'],['无號，終有凶。','無處呼號，終究有凶。']]},
{x:'天下有風，姤；后以施命誥四方。',c:['意外的機會或人物出現，先查清來歷再合作。','有意外財，但也防陷阱。','邂逅之象，但對方未必適合長久，別太快承諾。','注意突發不適與過敏。','出行可能有意外相遇。'],
y:[['繫于金柅，貞吉。有攸往，見凶，羸豕孚蹢躅。','用金屬煞車制止，守正則吉；放任則見凶。'],['包有魚，无咎，不利賓。','廚房裡有魚，自己掌握則無咎，不宜讓給外人。'],['臀无膚，其行次且，厲，无大咎。','坐立不安、行動遲疑，有危險但無大咎。'],['包无魚，起凶。','廚房裡沒有魚，失去民心，凶。'],['以杞包瓜，含章，有隕自天。','以杞樹葉包瓜，藏才於內，自有天降之福。'],['姤其角，吝，无咎。','在角上相遇，孤高有憾，但無咎。']]},
{x:'澤上於地，萃；君子以除戎器，戒不虞。',c:['人才與資源匯聚，適合辦活動、組團隊、募資。','聚財之象，可集資或參加團體投資。','聚會中容易遇到對象；已有伴則適合見親友。','人多注意傳染病，聚餐節制。','參加集會、廟會、團體活動吉。'],
y:[['有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往无咎。','誠信不能持久而亂；呼號求助則轉悲為笑，前往無咎。'],['引吉，无咎，孚乃利用禴。','被引薦則吉，誠心即使薄禮也可。'],['萃如嗟如，无攸利，往无咎，小吝。','想聚而嗟嘆無利，前往無咎，小有憾。'],['大吉，无咎。','大吉，無咎。'],['萃有位，无咎。匪孚，元永貞，悔亡。','居位聚眾無咎；若未得信服，長久守正則悔亡。'],['齎咨涕洟，无咎。','嘆息流淚，警覺自省則無咎。']]},
{x:'地中生木，升；君子以順德，積小以高大。',c:['循序漸進地升遷、升學、晉級；見主管、面試吉。','財運逐步上升，穩健累積。','關係穩定前進，可見家長、談未來。','體能逐步改善，持續鍛鍊。','往南方或向上發展吉。'],
y:[['允升，大吉。','得到信任而上升，大吉。'],['孚乃利用禴，无咎。','誠心即使薄禮也可，無咎。'],['升虛邑。','上升如入無人之城，順利無阻。'],['王用亨于岐山，吉无咎。','得到上級的重用，吉無咎。'],['貞吉，升階。','守正則吉，步步高升。'],['冥升，利于不息之貞。','盲目上升，宜持續守正、不可停息。']]},
{x:'澤无水，困；君子以致命遂志。',c:['處境受困、說話沒人信，少說多做，以實績證明自己。','手頭緊，避免借貸，開源節流。','感情困頓，彼此都累，給雙方喘息空間。','注意疲勞、口乾、泌尿系統與情緒。','行程受阻或資金不足，暫緩。'],
y:[['臀困于株木，入于幽谷，三歲不覿。','坐困枯木、入於幽谷，長久不見光明。'],['困于酒食，朱紱方來，利用享祀，征凶，无咎。','困於酒食應酬，有官位將至；宜誠心祭祀，急進則凶。'],['困于石，據于蒺藜，入于其宮，不見其妻，凶。','被石頭所困、靠著荊棘，回家不見妻子，凶。'],['來徐徐，困于金車，吝，有終。','來得緩慢，受困於金車，有憾但有結果。'],['劓刖，困于赤紱，乃徐有說，利用祭祀。','受上下所困，慢慢會有轉機，宜誠心。'],['困于葛藟，于臲卼，曰動悔。有悔，征吉。','被藤蔓纏繞、動搖不安；悔悟後再前進則吉。']]},
{x:'木上有水，井；君子以勞民勸相。',c:['守住專業、持續服務客戶最穩；適合整修系統、充實技能。','收入穩定但無暴利，維持即可。','穩定平淡的關係，需要經營新鮮感。','注意水分補充、腎與泌尿系統。','不宜搬遷，宜守舊地。'],
y:[['井泥不食，舊井无禽。','井底污泥不能食用，舊井連鳥都不來，被人遺棄。'],['井谷射鮒，甕敝漏。','井水只能射小魚、水甕破漏，才能未得發揮。'],['井渫不食，為我心惻。可用汲，王明，並受其福。','井已淘淨卻無人飲用，令人惋惜；遇明主則共享其福。'],['井甃，无咎。','修砌井壁、自我修整，無咎。'],['井洌，寒泉食。','井水清冽甘甜，為人所用。'],['井收勿幕，有孚元吉。','井水汲上而不加蓋，惠及眾人，大吉。']]},
{x:'澤中有火，革；君子以治曆明時。',c:['變革時機到了，適合轉職、轉型、改制度；先取得信任。','調整投資組合、換理財方式。','關係需要改變相處模式，或告別舊感情。','改變生活習慣、換醫師或療法的好時機。','搬家、換環境有利。'],
y:[['鞏用黃牛之革。','用黃牛皮牢牢綁住，時機未到不宜變革。'],['己日乃革之，征吉，无咎。','時機成熟再變革，前往吉，無咎。'],['征凶，貞厲。革言三就，有孚。','急進則凶；變革的主張經多次討論才得信服。'],['悔亡，有孚改命，吉。','悔恨消失，以誠信改變命運，吉。'],['大人虎變，未占有孚。','大人如虎紋般煥然一新，不用占卜也已得信。'],['君子豹變，小人革面，征凶，居貞吉。','君子如豹紋般蛻變，小人也改頭換面，宜安居守正。']]},
{x:'木上有火，鼎；君子以正位凝命。',c:['建立新局面、新職位、新團隊；三方合作尤佳。','新事業帶來財富，可穩定擴大。','關係穩定、可定終身，適合結婚。','重視飲食調養，宜食補。','出行吉，利商務。'],
y:[['鼎顛趾，利出否。得妾以其子，无咎。','鼎足翻倒，正好倒出廢物，除舊佈新，無咎。'],['鼎有實，我仇有疾，不我能即，吉。','鼎中有實，對手有疾不能靠近我，吉。'],['鼎耳革，其行塞，雉膏不食。方雨虧悔，終吉。','鼎耳脫落、行動受阻，美食無法享用，終究吉。'],['鼎折足，覆公餗，其形渥，凶。','鼎足折斷、打翻食物，力不勝任，凶。'],['鼎黃耳金鉉，利貞。','鼎有黃耳金槓，中正得助，守正利。'],['鼎玉鉉，大吉，无不利。','鼎有玉槓，剛柔相濟，大吉無不利。']]},
{x:'洊雷，震；君子以恐懼脩省。',c:['突發狀況或人事震盪，冷靜處理反而能立功。','財務有驚嚇，先別慌著賣，冷靜評估。','關係受到衝擊，保持鎮定溝通。','注意驚嚇、心悸、肝與神經系統。','留意交通突發狀況。'],
y:[['震來虩虩，後笑言啞啞，吉。','雷來時驚恐，事後談笑自若，吉。'],['震來厲，億喪貝，躋于九陵，勿逐，七日得。','震動危險喪失財物；登高避險不必追，日後失而復得。'],['震蘇蘇，震行无眚。','驚懼不安，因震而行則無災。'],['震遂泥。','受驚陷入泥中，難以振作。'],['震往來厲，億无喪，有事。','震動往來皆危，但不會有大損失，能做成事。'],['震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。','驚恐失措，急進則凶；災禍未及己身先防範則無咎。']]},
{x:'兼山，艮；君子以思不出其位。',c:['宜停下來、守本分，暫不擴張或轉職。','守財、不動為宜。','關係需要暫停或冷靜，各自沉澱。','靜養、冥想有益，注意脾胃與背部。','不宜出行，宜留在原地。'],
y:[['艮其趾，无咎，利永貞。','在腳趾就停止，及早止步無咎，宜長久守正。'],['艮其腓，不拯其隨，其心不快。','停在小腿，無法挽救所跟隨之人，心中不快。'],['艮其限，列其夤，厲薰心。','停在腰部、脊肉撕裂，危險令人焦心。'],['艮其身，无咎。','止住全身、安守本分，無咎。'],['艮其輔，言有序，悔亡。','止住口舌，說話有條理，悔恨消失。'],['敦艮，吉。','敦厚地知止，吉。']]},
{x:'山上有木，漸；君子以居賢德善俗。',c:['按部就班地累積與升遷，急不得。','慢慢累積的財，長期投資有利。','循序漸進的感情，適合談婚嫁。','慢性調養見效，持之以恆。','出行按計畫進行。'],
y:[['鴻漸于干，小子厲，有言，无咎。','鴻雁漸進至水邊，年輕人有危險與閒言，無咎。'],['鴻漸于磐，飲食衎衎，吉。','漸進至磐石，飲食安樂，吉。'],['鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。','漸進至陸地，貿然遠行不返，凶，宜防範。'],['鴻漸于木，或得其桷，无咎。','漸進至樹上，找到平枝棲身，無咎。'],['鴻漸于陵，婦三歲不孕，終莫之勝，吉。','漸進至山陵，雖久受阻，終究無人能勝，吉。'],['鴻漸于陸，其羽可用為儀，吉。','漸進至高處，羽毛可作儀飾，成為典範，吉。']]},
{x:'澤上有雷，歸妹；君子以永終知敝。',c:['名分不正或位置不對，勿衝動接受；先確認權責。','衝動消費或投資易虧損。','感情名分不清或順序不對，冷靜評估。','注意情緒與生殖系統。','臨時起意的出行不宜。'],
y:[['歸妹以娣，跛能履，征吉。','以次位身分出嫁，雖如跛足仍能行走，前往吉。'],['眇能視，利幽人之貞。','如獨眼仍能看，宜安靜守正。'],['歸妹以須，反歸以娣。','急於出嫁，反而只能做次位。'],['歸妹愆期，遲歸有時。','延誤婚期，遲嫁自有時機。'],['帝乙歸妹，其君之袂，不如其娣之袂良。月幾望，吉。','尊貴而樸素，重德不重飾，吉。'],['女承筐无實，士刲羊无血，无攸利。','筐中無物、宰羊無血，徒有形式，無所利。']]},
{x:'雷電皆至，豐；君子以折獄致刑。',c:['事業高峰，把握當下全力衝刺，同時規劃退路。','收入豐厚，但要為下坡期準備。','感情熱烈，但要防熱度驟降。','精力旺盛，小心過勞與心血管。','出行熱鬧順利，宜中午前後。'],
y:[['遇其配主，雖旬无咎，往有尚。','遇到相配的主人，平等相處無咎，前往受賞識。'],['豐其蔀，日中見斗，往得疑疾，有孚發若，吉。','遮蔽太大、日中見星，前往遭猜疑；以誠感發則吉。'],['豐其沛，日中見沬，折其右肱，无咎。','遮蔽更甚，折斷右臂無法作為，無咎。'],['豐其蔀，日中見斗，遇其夷主，吉。','遮蔽中遇到志同道合之主，吉。'],['來章，有慶譽，吉。','招來賢才，有喜慶與讚譽，吉。'],['豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。','房屋豪華卻與世隔絕，門內寂靜無人，凶。']]},
{x:'山上有火，旅；君子以明慎用刑，而不留獄。',c:['工作變動、外派或短期專案；處於客位要謙和。','財來財去，旅途中注意財物。','異地戀或短暫緣分，不宜急定終身。','水土不服、作息不穩，注意休息。','出行之卦，保管好證件與財物。'],
y:[['旅瑣瑣，斯其所取災。','旅途中斤斤計較、猥瑣，自取其災。'],['旅即次，懷其資，得童僕貞。','旅途有住處、懷有資財、得到忠僕，安穩。'],['旅焚其次，喪其童僕，貞厲。','住處被焚、失去僕人，危險。'],['旅于處，得其資斧，我心不快。','暫有棲身與資財，心中仍不暢快。'],['射雉，一矢亡，終以譽命。','射雉失一箭，小有損失，終得讚譽。'],['鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。','鳥巢被焚，先笑後哭，失去根本，凶。']]},
{x:'隨風，巽；君子以申命行事。',c:['以溝通、協調、反覆說明推動事情；業務、顧問工作有利。','小財可得，穩健操作。','溫柔體貼取勝，但別優柔寡斷。','注意呼吸道、氣管與神經緊張。','出行順利，利拜訪貴人。'],
y:[['進退，利武人之貞。','進退猶豫，宜以武人的果斷守正。'],['巽在床下，用史巫紛若，吉无咎。','謙卑到床下，多方誠意溝通，吉無咎。'],['頻巽，吝。','屢屢屈從，有憾。'],['悔亡，田獲三品。','悔恨消失，打獵獲多種收穫。'],['貞吉悔亡，无不利。无初有終，先庚三日，後庚三日，吉。','守正吉，無初有終；變更前後要審慎，吉。'],['巽在床下，喪其資斧，貞凶。','過分卑屈，喪失資財與決斷力，凶。']]},
{x:'麗澤，兌；君子以朋友講習。',c:['利談判、銷售、教學、演講與客服；以和悅待人。','口才帶財，交際應酬有收穫。','甜蜜愉快，但要防甜言蜜語的誘惑。','注意口腔、喉嚨與肺部。','與朋友出遊愉快。'],
y:[['和兌，吉。','和悅待人，吉。'],['孚兌，吉，悔亡。','以誠信喜悅待人，吉，悔亡。'],['來兌，凶。','刻意討好求悅，凶。'],['商兌未寧，介疾有喜。','斟酌喜悅之事心未安；遠離小人則有喜。'],['孚于剝，有厲。','信任了會剝害你的人，有危險。'],['引兌。','引誘他人求悅，未必光明。']]},
{x:'風行水上，渙；先王以享于帝立廟。',c:['團隊渙散或部門重組，需要凝聚向心力；海外、遠方業務有利。','財有流散，注意大筆支出；可做公益。','距離感與冷淡，需要共同目標重新凝聚。','注意循環與受寒，保暖。','利遠行、出國、渡海。'],
y:[['用拯馬壯，吉。','借強壯的馬救援，吉。'],['渙奔其机，悔亡。','渙散時奔向可依靠之處，悔亡。'],['渙其躬，无悔。','拋開私我，無悔。'],['渙其群，元吉。渙有丘，匪夷所思。','解散小團體、成就大團結，大吉，成果出乎意料。'],['渙汗其大號，渙王居，无咎。','發布號令如汗出不返，散財聚民，無咎。'],['渙其血，去逖出，无咎。','遠離傷害與憂懼，無咎。']]},
{x:'澤上有水，節；君子以制數度，議德行。',c:['照規矩、守預算，節奏適中最好；過度苛刻反而難持久。','控制預算、建立儲蓄習慣。','保持適當距離與界線，關係更健康。','節制飲食與作息，但不必過度。','行程規劃好預算與時間。'],
y:[['不出戶庭，无咎。','不出家門、知節守時，無咎。'],['不出門庭，凶。','該出門時不出，錯失時機，凶。'],['不節若，則嗟若，无咎。','不知節制則嗟嘆，能自責改過則無咎。'],['安節，亨。','安於節制，亨通。'],['甘節，吉，往有尚。','甘於節制，吉，前往受讚賞。'],['苦節，貞凶，悔亡。','過度苦節，守之則凶，改之則悔亡。']]},
{x:'澤上有風，中孚；君子以議獄緩死。',c:['誠信是最大資產，利簽約、合作與客戶關係。','信用帶財，適合正當合作。','真心換真心，適合承諾與信任。','心誠氣順，保持平靜有益。','利遠行、渡海。'],
y:[['虞吉，有它不燕。','安守本分則吉，三心二意則不安。'],['鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。','鶴鳴於樹蔭，小鶴應和；以誠相感、好處共享。'],['得敵，或鼓或罷，或泣或歌。','遇到對手，情緒起伏不定。'],['月幾望，馬匹亡，无咎。','月近圓時離開同伴，專心向上，無咎。'],['有孚攣如，无咎。','以誠信緊密連結人心，無咎。'],['翰音登于天，貞凶。','雞鳴聲上天，虛聲過實，凶。']]},
{x:'山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。',c:['只宜做小事、守本分，不宜好高騖遠或大投資。','小額可行，大額勿動。','低調相處，勿過度期待。','注意小毛病，別大意。','宜近不宜遠，宜低不宜高。'],
y:[['飛鳥以凶。','鳥兒強飛向上，凶。'],['過其祖，遇其妣；不及其君，遇其臣，无咎。','不越分直達高層，與適當的人接觸，無咎。'],['弗過防之，從或戕之，凶。','不提防小人，可能受害，凶。'],['无咎，弗過遇之。往厲必戒，勿用永貞。','無咎，不過分而適當相處；前往有危險要戒備。'],['密雲不雨，自我西郊。公弋取彼在穴。','雲密不雨，力有未逮，宜求助於賢者。'],['弗遇過之，飛鳥離之，凶，是謂災眚。','過度而不知止，如飛鳥觸網，凶。']]},

function qimen(date){
  const lunar=Solar.fromDate(date).getLunar();
  const jq=S2T(lunar.getPrevJieQi(true).getName());
  const dayGZ=lunar.getDayInGanZhiExact(), hourGZ=lunar.getTimeInGanZhi();
  const di=gzIdx(dayGZ), fz=(di-di%5)%12;
  const yuan=[0,6,3,9].includes(fz)?0:[2,8,5,11].includes(fz)?1:2;
  const yang=YANGJQ.has(jq), ju=JQ_JU[jq][yuan];
  const earth={};const order='戊己庚辛壬癸丁丙乙';
  for(let k=0;k<9;k++){const p=yang?((ju-1+k)%9)+1:((ju-1-k+90)%9)+1;earth[p]=order[k]}
  const palOf=s=>+Object.keys(earth).find(p=>earth[p]===s);
  const hi=gzIdx(hourGZ), xun=Math.floor(hi/10), xunYi='戊己庚辛壬癸'[xun];
  const xp=palOf(xunYi), xp8=xp===5?2:xp;
  const zhiFu=STAR_HOME[xp], zhiShi=DOOR_HOME[xp8];
  let hs=hourGZ[0];if(hs==='甲')hs=xunYi;
  let tgt=palOf(hs);if(tgt===5)tgt=2;
  const shift=RING.indexOf(tgt)-RING.indexOf(xp8);
  const cells={};for(const p of [1,2,3,4,6,7,8,9])cells[p]={p,earth:earth[p],heaven:'',star:'',door:'',god:''};
  RING.forEach((p,i)=>{const to=RING[(i+shift+16)%8];cells[to].star=STAR_HOME[p];cells[to].heaven=earth[p];if(p===2){cells[to].star+='‧禽';cells[to].heaven+=earth[5]}});
  let dp=xp;for(let s=0;s<hi%10;s++)dp=yang?(dp%9)+1:((dp+7)%9)+1;
  if(dp===5)dp=2;
  const dshift=RING.indexOf(dp)-RING.indexOf(xp8);
  RING.forEach((p,i)=>{cells[RING[(i+dshift+16)%8]].door=DOOR_HOME[p]});
  const g0=RING.indexOf(tgt);
  GODS.forEach((g,k)=>{cells[RING[yang?(g0+k)%8:(g0-k+16)%8]].god=g});
  const xz=(xun*10)%12, empty=[(xz+10)%12,(xz+11)%12];
  const Z2P=[1,8,8,3,4,4,9,2,2,7,6,6];
  const hz=ZHI.indexOf(hourGZ[1]);
  const maZ=[2,8,11,5][Math.floor([8,0,4,2,6,10,5,9,1,11,3,7].indexOf(hz)/3)]; // 申子辰→寅 寅午戌→申 巳酉丑→亥 亥卯未→巳
  for(const c of Object.values(cells)){
    c.kong=empty.some(z=>Z2P[z]===c.p); c.ma=Z2P[maZ]===c.p;
    const st=STAR_S[c.star.split('‧')[0]][0], dr=DOOR_S[c.door][0], gd=GOD_S[c.god][0];
    c.po=(DOOR_WX[c.door]+2)%5===PAL_WX[c.p]; // 門迫：門剋宮
    c.score=dr*1.5+st+gd-(c.kong?1:0)-(c.po&&dr>0?1:0);
  }
  return {lunar,jq,yang,ju,yuan:'上中下'[yuan],dayGZ,hourGZ,xunYi,zhiFu,zhiShi,earth5:earth[5],cells,
    kong:empty.map(z=>ZHI[z]).join(''),maZ:ZHI[maZ]};
}

function derive(){
  const [y,m,d]=P.date.split('-').map(Number);
  const hh=P.hour===0?0:P.hour===12?23:P.hour*2-1;
  const solar=Solar.fromYmdHms(y,m,d,hh,30,0), lunar=solar.getLunar(), ec=lunar.getEightChar();
  const pillars=[ec.getYear(),ec.getMonth(),ec.getDay(),ec.getTime()];
  const dm=pillars[2][0], dmE=gWx(dm);

  pillars.forEach((p,i)=>{const a=gWx(p[0]),b=zWx(p[1]),wb=i===1?2:1;cnt[a]+=1;cnt[b]+=1;
    if(a===dmE||a===(dmE+4)%5)support+=1;if(b===dmE||b===(dmE+4)%5)support+=wb});
  const strong=support>=4.5;

  const ji=strong?[(dmE+4)%5,dmE]:[(dmE+3)%5,(dmE+2)%5];

}

function analyse(lines){
  const base=lines.map(v=>v%2).join(''), chg=lines.map(v=>v===9?0:v===6?1:v%2).join('');
  const hu=base.slice(1,4)+base.slice(2,5);
  const bi=HEXMAP[base], ci=HEXMAP[chg], hi=HEXMAP[hu];
  const mv=lines.map((v,i)=>v===6||v===9?i:-1).filter(i=>i>=0);
  const n=mv.length, sb=HEX[bi][6], sc=HEX[ci][6];
  let rule, focus, score;
  const still=[0,1,2,3,4,5].filter(i=>!mv.includes(i));
  if(n===0){rule='六爻皆靜，以本卦卦辭為斷。';focus=[];score=sb}
  else if(n===1){rule=`一爻動，以本卦${YAO_POS[mv[0]]}為斷。`;focus=[mv[0]];score=sb}
  else if(n===2){rule=`兩爻動，以本卦兩動爻為斷，以上方的${YAO_POS[mv[1]]}為主。`;focus=[mv[1],mv[0]];score=sb}
  else if(n===3){rule='三爻動，本卦為體、變卦為用，兩卦卦辭合參。';focus=mv;score=Math.round((sb+sc)/2)}
  else if(n===4){rule=`四爻動，以變卦兩靜爻為斷，以下方的${YAO_POS[still[0]]}為主。`;focus=still;score=Math.round(sc*.7+sb*.3)}
  else if(n===5){rule=`五爻動，以變卦唯一靜爻${YAO_POS[still[0]]}為斷。`;focus=still;score=Math.round(sc*.7+sb*.3)}
  else{rule=bi===0?'六爻全動，乾卦看「用九：見群龍无首，吉」。':bi===1?'六爻全動，坤卦看「用六：利永貞」。':'六爻全動，以變卦卦辭為斷。';focus=[];score=sc}
  return {lines,bi,ci,hi,mv,n,rule,focus,score};
}

function fortune(date){
  const L=Solar.fromDate(date).getLunar(), gz=L.getDayInGanZhiExact(), ss=shishen(D.dm,gz[0]), base=gzScore(gz);
  const dz=ZHI.indexOf(gz[1]), mz=ZHI.indexOf(D.pillars[2][1]);
  const chong=Math.abs(dz-mz)===6, he=LIUHE[mz]===dz;
  const h=hash(`${date.getFullYear()}-${date.getMonth()}-${date.getDate()}|${P.sur}${P.given}|${P.date}`);
  const AREA=[['事業',['正官','七殺','正印','偏印'],'工作、學業與上司'],['財運',['正財','偏財','食神'],'收入、消費與投資'],['感情',P.gender==='男'?['正財','偏財','食神']:['正官','七殺','傷官'],'戀愛、伴侶與桃花'],['健康',['正印','比肩','食神'],'體力、睡眠與情緒'],['人際',['比肩','劫財','食神','傷官','正印'],'朋友、同事與貴人']];
  const areas=AREA.map(([n,set,d],k)=>{let s=base+(set.includes(ss)?1:0)+(((h>>>(k*3))&7)/7-.5)*.9;
    if(n==='健康'&&chong)s-=1;if(n==='感情'){if(he)s+=1;if(chong)s-=.5}if(n==='人際'&&chong)s-=.5;
    return {n,d,s:Math.max(1,Math.min(5,Math.round(s*2)/2))}});
  const avg=areas.reduce((a,b)=>a+b.s,0)/areas.length;
  const total=Math.round(32+(avg-1)/4*66);
  const word=total>=85?'大吉':total>=70?'吉':total>=55?'平':'宜守';
  const le=D.xi[h%D.xi.length], la=GC.WX_ADV[le];
  const ds=GAN.indexOf(gz[0]), hs0=(ds%5)*2;
  const hours=ZHI.split('').map((z,k)=>{const g=GAN[(hs0+k)%10]+z;return {k,g,s:gzScore(g),r:`${String((k*2+23)%24).padStart(2,'0')}–${String((k*2+1)%24).padStart(2,'0')}`}});
  const good=[...hours].sort((a,b)=>b.s-a.s||a.k-b.k).slice(0,3).sort((a,b)=>a.k-b.k);
  const bad=[...hours].sort((a,b)=>a.s-b.s||a.k-b.k)[0];
  const best=areas.reduce((a,b)=>b.s>a.s?b:a), worst=areas.reduce((a,b)=>b.s<a.s?b:a);

  if(he)note+=`今日${gz[1]}與你的日支六合，人緣與感情運加分。`;
  const sum=`今天整體${word==='大吉'?'非常順':word==='吉'?'不錯':word==='平'?'平穩':'需要多一分耐心'}，${best.n}運最好，${worst.s<3?`${worst.n}要多留意。`:'各方面都還算穩定。'}`;
  return {L,gz,ss,areas,total,word,le,la,good,bad,hx,hm,note,sum,chong,he,
    yi:L.getDayYi().slice(0,6).map(S2T),ji:L.getDayJi().slice(0,6).map(S2T),

}
function dial(score){

  const HAI={0:7,7:0,1:6,6:1,2:5,5:2,3:4,4:3,8:11,11:8,9:10,10:9};
  const tai=bz===yz?'值太歲（本命年）':Math.abs(bz-yz)===6?'沖太歲':HAI[bz]===yz?'害太歲':'';
  let score=gzScore(gz)-(tai.startsWith('值')||tai==='沖太歲'?1:tai?.5:0);
  let zw=null;
  if(D.astro){try{const Y=D.astro.horoscope(new Date(y,6,1)).yearly;const yi=Y.palaceNames.indexOf('命宮');
    const where=Y.mutagen.map(s=>D.astro.palaces.findIndex(p=>[...p.majorStars,...p.minorStars].some(x=>x.name===s)));
    if(where[0]===yi)score+=.5; if(where[3]===yi||where[3]===(yi+6)%12)score-=.5;

  score=Math.max(1,Math.min(5,Math.round(score*2)/2));
  return {y,gz,ss,tai,score,zw,age:y-D.lunar.getYear()+1};
}

function strokesOf(ch){return (nameOverride&&nameOverride[ch])||KX[ch]||0}
function nameAnalysis(sur,given){
  const S=[...sur].map(strokesOf), G=[...given].map(strokesOf);
  const ok=S.length&&G.length&&[...S,...G].every(n=>n>0);
  if(!ok)return {ok:false,S,G};
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const tian=S.length===1?S[0]+1:sum(S), ren=S[S.length-1]+G[0], di=G.length===1?G[0]+1:sum(G);
  const zong=sum(S)+sum(G), wai=tian+di-ren;
  const g={tian,ren,di,wai,zong};
  const pt=n=>({吉:100,半:65,凶:25}[n81(n)[0]]);
  const e=[numWx(tian),numWx(ren),numWx(di)];
  const r1=rel(e[0],e[1]), r2=rel(e[1],e[2]);
  const sc=r=>({生:100,被生:90,比和:85,剋:55,被剋:35}[r]);
  const sancai=Math.round((sc(r1)+sc(r2))/2);
  let score=Math.round(pt(ren)*.3+pt(di)*.2+pt(zong)*.3+pt(wai)*.1+sancai*.1);
  return {ok,S,G,g,e,r1,r2,sancai,score};
}
const POOL=(GC.POOL||'').split('|').filter(Boolean).map(x=>({c:x[0],e:WX.indexOf(x[1]),g:x[2],m:x.slice(3)}));
const POOLMAP=Object.fromEntries(POOL.map(x=>[x.c,x]));
let nmOpt={g:null,len:2,fix:'',pos:0,prefer:null,res:null,show:10};
function genNames(sur){
  const g=nmOpt.g||P.gender, pref=nmOpt.prefer||D.xi, gk=g==='男'?'m':g==='女'?'f':null;
  const pool=POOL.filter(x=>(!gk||x.g==='u'||x.g===gk)&&!sur.includes(x.c));
  const fix=[...(nmOpt.fix||'').trim()][0];
  const fixObj=fix?(POOLMAP[fix]||{c:fix,e:-1,g:'u',m:'指定用字'}):null;
  const combos=[];
  if(nmOpt.len===1){pool.forEach(a=>combos.push([a]))}
  else if(fixObj){pool.forEach(a=>{if(a.c!==fix)combos.push(nmOpt.pos===0?[fixObj,a]:[a,fixObj])})}
  else pool.forEach(a=>pool.forEach(b=>{if(a.c!==b.c)combos.push([a,b])}));
  const out=[];
  for(const cs of combos){
    const given=cs.map(x=>x.c).join('');const N=nameAnalysis(sur,given);if(!N.ok)continue;
    const ks=['ren','di','wai','zong'].map(k=>n81(N.g[k])[0]);
    if(ks.includes('凶'))continue;
    let sc=N.score+(D.xi.includes(N.e[1])?6:D.ji.includes(N.e[1])?-6:0);
    cs.forEach(x=>{if(pref.includes(x.e))sc+=4;if(D.ji.includes(x.e))sc-=4});
    if(ks.every(k=>k==='吉'))sc+=4;
    out.push({given,cs,N,sc});
  }
  out.sort((a,b)=>b.sc-a.sc);
  const used={},pick=[];
  for(const o of out){if(o.cs.some(x=>(used[x.c]||0)>=2&&x.c!==fix))continue;o.cs.forEach(x=>used[x.c]=(used[x.c]||0)+1);pick.push(o);if(pick.length>=30)break}
  return pick;
}

  <p class="small muted">盤面上南下北、左東右西。每宮左上為八神、右上天盤干、右下地盤干。</p>
  <div class="card stack">
    <div class="row between"><div><div class="eyebrow">問${qmCat} · 用神${kind==='door'?key+'門':key}</div><h3 class="h3">用神落${PAL[use.p][0]}${use.p}宮 · ${PAL[use.p][1]}方</h3></div><span class="pill ${uLv[0]}">${uLv[1]}</span></div>
    <p><b>${use.door}門</b>：${uD[1]}。<b>${use.star}</b>：${uS[1]}。<b>${use.god}</b>：${uG[1]}。</p>
    ${use.kong?'<p class="bad-t">用神落空亡：事情虛而不實，或時機未到，宜等出空（過了這個時辰／旬）再行動。</p>':''}
    ${use.po?`<p class="mid-t">${use.door}門受宮所迫（門迫），${DOOR_S[use.door][0]>0?'吉門被迫，好處打折扣。':'凶上加凶，宜避開。'}</p>`:''}
    ${use.ma?'<p class="good-t">逢驛馬，事情變動快，利出行與跑動。</p>':''}
    <div class="reader"><div class="seal" aria-hidden="true">遁</div><p>${us>=3?`此時${qmCat}之事可行，往${PAL[use.p][1]}方向或在此時辰行動最有利。`:us>=0?`${qmCat}之事吉凶參半，可行但要準備備案；若能選擇，改走${PAL[best.p][1]}方較順。`:`此時不利${qmCat}，建議換個時辰再看，或往${PAL[best.p][1]}方（${best.door}門）借力。`}</p></div>
  </div>
  ${qmSel?qmDetail(Q.cells[qmSel]):`<p class="small muted" style="text-align:center">點盤面任一宮，查看該方位的詳細解讀</p>`}
  <div class="card flat stack"><h3 class="h3">此時最佳方位：${PAL[best.p][1]}</h3><p class="small">${best.door}門・${best.star}・${best.god}。談事、出門、坐位面向這個方位，借一點天時地利。</p></div>`;
}

/* ---------- 導航 ---------- */
const VIEWS=['overview','yijing','ziwei','liunian','name','qimen'];
let cur='overview';
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function go(v,push=true){
  if(!VIEWS.includes(v))v='overview';
  const swap=()=>{cur=v;
    $$('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
    $$('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.v===v?'page':'false'));
    $('#tabInd').style.transform=`translateX(${VIEWS.indexOf(v)*100}%)`;
    render(v);window.scrollTo({top:0});};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(push&&document.startViewTransition&&!reduce&&v!==cur){buzz();document.startViewTransition(swap)}else swap();
  if(push)try{history.replaceState(null,'','#'+v)}catch(e){}
  store.set('gx_tab',v);
}
function render(v){({overview:renderOverview,yijing:renderYijingForm,ziwei:renderZiwei,liunian:renderLiunian,name:renderName,qimen:renderQimen})[v]()}
function updateHeader(){
  $('#whoName').textContent=P.sur+P.given+(P.sample?'（範例）':'');
  $('#whoAv').textContent=SX[ZHI.indexOf(D.birthZ)];
  const L=Solar.fromDate(new Date()).getLunar();
  $('#todayLine').textContent=`${L.getYearInGanZhi()}年 ${S2T(L.getMonthInChinese())}月${S2T(L.getDayInChinese())} · ${S2T(L.getPrevJieQi(true).getName())}`;
}

/* ---------- 命主表單 ---------- */
function openSheet(){
  $('#pSur').value=P.sur;$('#pGiven').value=P.given;$('#pDate').value=P.date;
  $('#pHour').innerHTML=HOURS.map((h,i)=>`<option value="${i}"${i===P.hour?' selected':''}>${h}</option>`).join('');
  $$('#pGender button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===P.gender));
  $('#sheetBack').hidden=false;setTimeout(()=>$('#pSur').focus(),50);
}
function closeSheet(){$('#sheetBack').hidden=true}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('tab'))return go(t.dataset.v);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.id==='whoBtn'||t.dataset.act==='profile')return openSheet();
  if(t.id==='pCancel')return closeSheet();
  if(t.dataset.g){$$('#pGender button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(t.dataset.act==='daily'){
    const bi=+t.dataset.h, m=+t.dataset.m;const bits=hexBits(bi);
    const lines=[...bits].map((b,i)=>i===m?(b==='1'?9:6):(b==='1'?7:8));
    go('yijing');const r=analyse(lines);$('#yjResult').innerHTML=readingHtml(r,{method:'每日一卦',time:'今日',q:'',cat:'綜合'});return;
  }
  if(t.dataset.cat){yjCat=t.dataset.cat;$$('#yjCats .chip').forEach(c=>c.setAttribute('aria-pressed',c===t));return}
  if(t.dataset.m&&t.closest('#yjMethod')){yjMethod=t.dataset.m;tossLines=[];renderYijingForm();return}
  if(t.id==='tossBtn'){if(tossLines.length>=6)return;const r=tossOne();showCoins(r.c);t.disabled=true;
    setTimeout(()=>{tossLines.push(r.v);const done=tossLines.length;$('#yao').insertAdjacentHTML('beforeend',yaoRow(r.v,done-1));
      t.disabled=done>=6;t.textContent=done>=6?'六爻已成':`擲第 ${done+1} 爻（${YAO_POS[done]}）`;$('#tossAll').textContent='重新起卦';
      if(done===6)finishCast(tossLines.slice(),'銅錢六擲')},matchMedia('(prefers-reduced-motion: reduce)').matches?0:720);return}
  if(t.id==='tossAll'){tossLines=[];let last;for(let i=0;i<6;i++){last=tossOne();tossLines.push(last.v)}renderYijingForm();showCoins(last.c);finishCast(tossLines.slice(),'銅錢六擲');return}
  if(t.id==='timeCast'){const L=Solar.fromDate(new Date()).getLunar();const Y=ZHI.indexOf(L.getYearZhi())+1,M=Math.abs(L.getMonth()),Dd=L.getDay(),Hr=ZHI.indexOf(L.getTimeZhi())+1;
    finishCast(meihua(Y+M+Dd,Y+M+Dd+Hr,Y+M+Dd+Hr),'時間起卦');return}
  if(t.id==='numCast'){const a=+$('#n1').value||1,b=+$('#n2').value||1,c=+$('#n3').value||1;finishCast(meihua(a,b,a+b+c),'報數起卦');return}
  if(t.dataset.hist!==undefined){const x=store.get('gx_hist',[])[+t.dataset.hist];if(x){$('#yjResult').innerHTML=readingHtml(analyse(x.lines),x.meta);$('#yjResult').scrollIntoView({behavior:'smooth'})}return}
  if(t.id==='yjClear'){store.set('gx_hist',[]);renderHist();toast('紀錄已清除');return}
  if(t.dataset.pal!==undefined){zwSel=+t.dataset.pal;renderZiwei();return}
  if(t.dataset.zy!==undefined){zwYearOn=t.dataset.zy==='1';renderZiwei();return}
  if(t.dataset.yr){lnYear=+t.dataset.yr;renderLiunian();return}
  if(t.dataset.day!==undefined){const n=+t.dataset.day,dir=n-dayOff;if(n===dayOff)return;dayOff=n;refreshDaily(dir);return}
  if(t.dataset.chk!==undefined){const i=+t.dataset.chk,k=dayKey();let c=store.get(k,[]);c=c.includes(i)?c.filter(x=>x!==i):[...c,i];store.set(k,c);t.classList.toggle('on',c.includes(i));t.setAttribute('aria-pressed',c.includes(i));const pill=$('#guide .pill');if(pill){pill.textContent=`${c.length}/5`;pill.className=`pill ${c.length>=5?'good':'mid'} num`}if(c.length===5)toast('今天的功課都完成了');buzz();return}
  if(t.dataset.ask){yjCat=t.dataset.ask;go('yijing');setTimeout(()=>{const q=$('#yjQ');if(q)q.focus()},350);return}
  if(t.dataset.qc){qmCat=t.dataset.qc;qmSel=null;renderQimen();return}
  if(t.dataset.qp){qmSel=+t.dataset.qp===qmSel?null:+t.dataset.qp;renderQimen();const d=$('#qmDetail');if(d)d.scrollIntoView({behavior:'smooth',block:'nearest'});return}
  if(t.dataset.ng){nmOpt.g=t.dataset.ng;nmOpt.res=null;renderName();return}
  if(t.dataset.nl){nmOpt.len=+t.dataset.nl;nmOpt.res=null;renderName();return}
  if(t.dataset.np){nmOpt.fix=$('#nmFix')?.value||'';nmOpt.pos=+t.dataset.np;nmOpt.res=null;renderName();return}
  if(t.dataset.ne){const e=+t.dataset.ne;const pr=[...(nmOpt.prefer||D.xi)];const k=pr.indexOf(e);if(k>=0)pr.splice(k,1);else pr.push(e);nmOpt.prefer=pr;renderName();return}
  if(t.id==='genBtn'){nmOpt.fix=$('#nmFix')?.value||'';const sur=$('#nmSur').value.trim()||P.sur;t.textContent='推算中…';setTimeout(()=>{nmOpt.res=genNames(sur);nmOpt.show=10;renderName();const c=$('#genCard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});toast(nmOpt.res.length?`找到 ${nmOpt.res.length} 個好名字`:'找不到符合的名字')},30);return}
  if(t.dataset.try){$('#nmGiven').value=t.dataset.try;renderName();window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.tryfull){const f=t.dataset.tryfull,sl=[...($('#nmSur').value.trim()||P.sur)].length;$('#nmSur').value=[...f].slice(0,sl).join('');$('#nmGiven').value=[...f].slice(sl).join('');renderName();window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.fav){const sur=$('#nmSur').value.trim(),n=sur+t.dataset.fav;let f=store.get('gx_fav',[]);f=f.includes(n)?f.filter(x=>x!==n):[n,...f].slice(0,30);store.set('gx_fav',f);t.textContent=f.includes(n)?'已收藏 ✓':'收藏';toast(f.includes(n)?'已加入收藏':'已取消收藏');return}
  if(t.id==='genMore'){nmOpt.show+=10;renderName();return}
  if(t.id==='favClear'){store.set('gx_fav',[]);renderName();toast('收藏已清除');return}
  if(t.id==='qmNow'){qmTime=null;renderQimen();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nmSur'||t.id==='nmGiven'){clearTimeout(renderName.t);renderName.t=setTimeout(()=>{const id=t.id,pos=t.selectionStart;renderName();const el=$('#'+id);el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}},350)}
  if(t.dataset&&t.dataset.ch){nameOverride=nameOverride||{};nameOverride[t.dataset.ch]=+t.value||0;clearTimeout(renderName.t);renderName.t=setTimeout(()=>{const ch=t.dataset.ch;renderName();const el=$(`input[data-ch="${CSS.escape(ch)}"]`);if(el)el.focus()},500)}
});
document.addEventListener('change',e=>{if(e.target.id==='qmT'&&e.target.value){const d=new Date(e.target.value);if(!isNaN(d)){qmTime=d;renderQimen()}}});
$('#sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetBack').hidden)closeSheet()});
$('#pForm').addEventListener('submit',e=>{
  e.preventDefault();
  const g=$('#pGender button[aria-pressed="true"]');
  const np={sur:$('#pSur').value.trim(),given:$('#pGiven').value.trim(),gender:g?g.dataset.g:P.gender,date:$('#pDate').value,hour:+$('#pHour').value,sample:false};
  if(!np.sur||!np.given||!np.date){toast('請填寫姓名與生日');return}
  const yy=+np.date.slice(0,4);if(yy<1900||yy>2099){toast('生日請在 1900–2099 年之間');return}
  P=np;store.set('gx_profile',P);nameOverride=null;zwSel=null;$('#v-name').innerHTML='';
  derive();updateHeader();closeSheet();go(cur,false);toast('命盤已更新');
});

/* ---------- 手勢與捲動 ---------- */
addEventListener('scroll',()=>{$('.top').classList.toggle('scrolled',scrollY>8)},{passive:true});
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{const d=e.target.closest('#daily');if(!d){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx))return;const n=Math.max(0,Math.min(6,dayOff+(dx<0?1:-1)));if(n!==dayOff){const dir=n-dayOff;dayOff=n;buzz();refreshDaily(dir)}},{passive:true});
/* ---------- 啟動 ---------- */
function boot(){
  if(!window.Solar||!window.iztro){$('#boot').textContent='命理曆法元件載入失敗，請檢查網路後重新整理。';return}
  try{derive()}catch(err){console.error(err);P=SAMPLE;derive()}
  $('#boot').remove();updateHeader();
  const h=(location.hash||'').slice(1);go(VIEWS.includes(h)?h:store.get('gx_tab','overview'),false);
}
boot();
})();
</script>
