<title>觀象閣</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone-width column (max 560px) like a pocket almanac; sticky title bar, fixed bottom tab bar of seal-stamp glyphs. */
:root{
  --paper:#e6ebe5;      /* celadon-grey ground */
  --surface:#f5f7f3;
  --surface-2:#edf1ec;
  --ink:#1b2321;
  --muted:#5a6964;
  --line:#c8d1ca;
  --seal:#b23a2b;       /* cinnabar seal, the one accent */
  --seal-ink:#fff7f2;
  --brass:#8a6a2c;
  --good:#2f7a5f; --mid:#9a6a12; --bad:#a0383a;
  --wood:#3d7a4f; --fire:#c0482e; --earth:#9a6a12; --metal:#6f7884; --water:#2e5f8a;
  --lu:#2f7a5f; --quan:#b23a2b; --ke:#2e5f8a; --ji:#6b4a7a;
  --shadow:0 1px 2px rgba(27,35,33,.06),0 6px 18px rgba(27,35,33,.06);
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1614;--surface:#18211e;--surface-2:#1e2925;--ink:#e3e9e4;--muted:#93a39c;--line:#2d3a35;
  --seal:#e0644f;--seal-ink:#1a0d0a;--brass:#c9a65f;
  --good:#6cc29e;--mid:#d9a845;--bad:#ec7f7a;
  --wood:#79c08a;--fire:#ef7b5f;--earth:#d9a845;--metal:#aab4bf;--water:#77a9d6;
  --lu:#6cc29e;--quan:#ef7b5f;--ke:#77a9d6;--ji:#c49bd6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1614;--surface:#18211e;--surface-2:#1e2925;--ink:#e3e9e4;--muted:#93a39c;--line:#2d3a35;
  --seal:#e0644f;--seal-ink:#1a0d0a;--brass:#c9a65f;
  --good:#6cc29e;--mid:#d9a845;--bad:#ec7f7a;
  --wood:#79c08a;--fire:#ef7b5f;--earth:#d9a845;--metal:#aab4bf;--water:#77a9d6;
  --lu:#6cc29e;--quan:#ef7b5f;--ke:#77a9d6;--ji:#c49bd6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.seal{width:34px;height:34px;border-radius:6px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:700;flex:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--seal-ink) 35%,transparent)}
.brand h1{font-size:21px;letter-spacing:.08em}
.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;font-family:var(--f-body);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;max-width:50%}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;border:1px solid var(--line)}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.who:focus-visible,.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.cell:focus-visible,.yr:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* generic blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.h2{font-size:22px}
.h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin-block:4px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;border:1px dashed var(--seal);color:var(--ink);background:color-mix(in srgb,var(--seal) 7%,var(--surface));font-size:14px}
.banner b{color:var(--seal)}
.banner .btn{white-space:nowrap;flex:none}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.pill.good{color:var(--good)}.pill.mid{color:var(--mid)}.pill.bad{color:var(--bad)}
.el{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:700;color:var(--surface);flex:none}
.el.e0{background:var(--wood)}.el.e1{background:var(--fire)}.el.e2{background:var(--earth)}.el.e3{background:var(--metal)}.el.e4{background:var(--water)}
.t0{color:var(--wood)}.t1{color:var(--fire)}.t2{color:var(--earth)}.t3{color:var(--metal)}.t4{color:var(--water)}

/* meter: five ticks */
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--seal)}
.meter.big i{width:22px;height:8px}

/* field */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:16px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:72px;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--seal);outline-offset:0;border-color:transparent}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;cursor:pointer;color:var(--muted);font-size:11px;letter-spacing:.06em}
.tab b{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;font-weight:700;border:1.5px solid currentColor;transition:all .2s}
.tab[aria-current="page"]{color:var(--seal)}
.tab[aria-current="page"] b{background:var(--seal);color:var(--seal-ink);border-color:var(--seal)}

/* overview: four pillars */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.pillar{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.pillar .lb{font-size:11px;color:var(--muted);letter-spacing:.1em}
.pillar .gz{font-family:var(--f-display);font-size:26px;line-height:1.15;display:flex;flex-direction:column;align-items:center;margin-block:2px}
.pillar .ss{font-size:11px;color:var(--muted)}
.pillar.dm{border-color:var(--seal)}
.wxbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.wxbar span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stat .v{font-family:var(--f-display);font-size:20px;line-height:1.3}
.stat .s{font-size:12px;color:var(--muted)}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.yiji{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.yiji b{font-family:var(--f-display);width:26px;height:26px;display:grid;place-items:center;border-radius:6px;font-size:15px}
.yiji .y{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.yiji .j{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* hexagram */
.hexes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.hex{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.hex .tag{font-size:11px;color:var(--muted);letter-spacing:.12em}
.hex .nm{font-family:var(--f-display);font-size:18px;line-height:1.2}
.hex .full{font-size:12px;color:var(--muted)}
.lines{display:flex;flex-direction:column-reverse;gap:6px;width:72px}
.ln{height:9px;display:flex;gap:12px;position:relative}
.ln span{flex:1;background:var(--ink);border-radius:2px}
.ln.mv span{background:var(--seal)}
.ln .mk{position:absolute;right:-18px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--seal);line-height:1}
.hex.main .lines{width:84px}
.hex.main .ln{height:11px}
.yao{display:flex;flex-direction:column-reverse;gap:6px;min-height:120px;justify-content:flex-start}
.yao-row{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;gap:10px;font-size:13px;animation:rise .35s ease both}
.yao-row .bar{height:10px;display:flex;gap:14px}
.yao-row .bar span{flex:1;background:var(--ink);border-radius:2px}
.yao-row.mv .bar span{background:var(--seal)}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.coins{display:flex;gap:16px;justify-content:center;padding-block:8px;perspective:600px}
.coin{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--brass) 55%,var(--surface)),var(--brass));border:2px solid color-mix(in srgb,var(--brass) 70%,var(--ink));position:relative;display:grid;place-items:center;color:var(--surface);font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.05em;transform-style:preserve-3d}
.coin::after{content:"";position:absolute;width:16px;height:16px;border:2px solid color-mix(in srgb,var(--brass) 60%,var(--ink));background:var(--paper);left:50%;top:50%;transform:translate(-50%,-50%)}
.coin .t{position:absolute;inset:0}
.coin .t i{position:absolute;font-style:normal}
.coin .t i:nth-child(1){top:5px}.coin .t i:nth-child(2){bottom:5px}.coin .t i:nth-child(3){left:7px}.coin .t i:nth-child(4){right:7px}
.coin.flip{animation:flip .7s ease-out}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(540deg) translateY(-26px)}100%{transform:rotateY(1080deg) translateY(0)}}
.ritual{font-size:13px;color:var(--muted);border-left:3px solid var(--seal);padding-left:10px}
.quote{font-family:var(--f-display);font-size:17px;line-height:1.7;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.reader{display:flex;gap:12px;align-items:flex-start}
.reader .seal{width:30px;height:30px;font-size:16px}
.reader p{flex:1;min-width:0}
.hist{display:flex;flex-direction:column}
.hist button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;cursor:pointer}
.hist button:first-child{border-top:0}
.hist .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ziwei board */
.board-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,auto);gap:3px;min-width:340px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 5px 4px;min-height:118px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;position:relative;min-width:0}
.cell.sel{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal)}
.cell.sf{background:color-mix(in srgb,var(--seal) 6%,var(--surface))}
.cell .maj{display:flex;flex-direction:column;gap:0;font-family:var(--f-display);font-size:14px;line-height:1.25}
.cell .maj em{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--f-body)}
.mu{display:inline-block;font-size:10px;line-height:1;padding:2px 3px;border-radius:3px;color:var(--surface);margin-left:2px;vertical-align:1px;font-family:var(--f-body);font-weight:700}
.mu.祿{background:var(--lu)}.mu.權{background:var(--quan)}.mu.科{background:var(--ke)}.mu.忌{background:var(--ji)}
.mu.ly{outline:1.5px dashed var(--ink);outline-offset:-1px}
.cell .min{font-size:10.5px;color:var(--muted);line-height:1.3;word-break:break-all}
.cell .min .g{color:var(--good)}.cell .min .b{color:var(--bad)}
.cell .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:2px}
.cell .pn{font-size:12.5px;font-weight:700}
.cell.ming .pn{color:var(--seal)}
.cell .gz{font-size:10px;color:var(--muted);text-align:right;line-height:1.2}
.cell .ln-tag{align-self:flex-start;font-size:9.5px;padding:0 4px;border-radius:4px;background:var(--ink);color:var(--paper);line-height:1.5}
.cell .body-tag{font-size:9.5px;color:var(--seal);border:1px solid var(--seal);border-radius:3px;padding:0 2px;margin-left:2px}
.center{grid-column:2 / span 2;grid-row:2 / span 2;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;justify-content:center;text-align:center;font-size:12px;min-width:0}
.center .nm{font-family:var(--f-display);font-size:20px}

/* liunian */
.years{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.yr{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:center;cursor:pointer;min-width:74px}
.yr .y{font-size:12px;color:var(--muted)}
.yr .g{font-family:var(--f-display);font-size:19px;line-height:1.3}
.yr[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.yr[aria-pressed="true"] .y{color:inherit;opacity:.75}
.yr .meter i{width:8px;height:4px}
.yr[aria-pressed="true"] .meter i{background:color-mix(in srgb,var(--paper) 30%,transparent)}
.yr[aria-pressed="true"] .meter i.on{background:var(--seal)}
.dayun{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dy{flex:none;width:62px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px;background:var(--surface-2)}
.dy.on{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 8%,var(--surface))}
.dy .g{font-family:var(--f-display);font-size:18px;line-height:1.2}
.dy .a{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
svg text{font-family:var(--f-body)}

/* name */
.namegrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ch{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.ch .c{font-family:var(--f-display);font-size:34px;line-height:1;width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.ch.v .c{color:var(--muted);border-style:dashed;font-size:22px}
.ch input{width:56px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface);font-variant-numeric:tabular-nums}
.ch small{font-size:11px;color:var(--muted)}
.gridlist{display:flex;flex-direction:column}
.ge{display:grid;grid-template-columns:52px 46px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ge:first-child{border-top:0}
.ge .lb{font-family:var(--f-display);font-size:16px}
.ge .lb small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);line-height:1.2}
.ge .n{font-size:22px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ge .d{font-size:13px;min-width:0}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-variant-numeric:tabular-nums}
.ring b small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:-30px}

/* qimen */
.qm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:104px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;gap:2px;font-size:12px;position:relative;min-width:0}
.qc .god{grid-column:1;color:var(--muted)}
.qc .hs{grid-column:2;text-align:right;font-weight:700}
.qc .mid{grid-column:1 / span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);line-height:1.25}
.qc .mid .st{font-size:14px}
.qc .mid .dr{font-size:18px}
.qc .pal{grid-column:1;color:var(--muted);font-size:11px}
.qc .es{grid-column:2;text-align:right;color:var(--muted)}
.qc.use{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal)}
.qc.best{background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.qc .flag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;padding:0 6px;border-radius:6px;background:var(--seal);color:var(--seal-ink);white-space:nowrap}
.qc .flag.g{background:var(--good);color:var(--surface)}

const GOD_S={值符:[1,'貴人與領導支持'],螣蛇:[-1,'虛驚、反覆糾纏'],太陰:[1,'暗中相助、宜策劃'],六合:[1,'合作、婚姻、中介'],白虎:[-1,'衝突、傷災、強勢'],玄武:[-1,'欺瞞、失竊、暗昧'],九地:[1,'穩守、潛藏、長久'],九天:[1,'揚威、出擊、遠行']};

function qimen(date){
  const lunar=Solar.fromDate(date).getLunar();
  const jq=S2T(lunar.getPrevJieQi(true).getName());
  const dayGZ=lunar.getDayInGanZhiExact(), hourGZ=lunar.getTimeInGanZhi();
  const di=gzIdx(dayGZ), fz=(di-di%5)%12;
  const yuan=[0,6,3,9].includes(fz)?0:[2,8,5,11].includes(fz)?1:2;
  const yang=YANGJQ.has(jq), ju=JQ_JU[jq][yuan];
  const earth={};const order='戊己庚辛壬癸丁丙乙';
  for(let k=0;k<9;k++){const p=yang?((ju-1+k)%9)+1:((ju-1-k+90)%9)+1;earth[p]=order[k]}
  const palOf=s=>+Object.keys(earth).find(p=>earth[p]===s);
  const hi=gzIdx(hourGZ), xun=Math.floor(hi/10), xunYi='戊己庚辛壬癸'[xun];
  const xp=palOf(xunYi), xp8=xp===5?2:xp;
  const zhiFu=STAR_HOME[xp], zhiShi=DOOR_HOME[xp8];
  let hs=hourGZ[0];if(hs==='甲')hs=xunYi;
  let tgt=palOf(hs);if(tgt===5)tgt=2;
  const shift=RING.indexOf(tgt)-RING.indexOf(xp8);
  const cells={};for(const p of [1,2,3,4,6,7,8,9])cells[p]={p,earth:earth[p],heaven:'',star:'',door:'',god:''};
  RING.forEach((p,i)=>{const to=RING[(i+shift+16)%8];cells[to].star=STAR_HOME[p];cells[to].heaven=earth[p];if(p===2){cells[to].star+='‧禽';cells[to].heaven+=earth[5]}});
  let dp=xp;for(let s=0;s<hi%10;s++)dp=yang?(dp%9)+1:((dp+7)%9)+1;
  if(dp===5)dp=2;
  const dshift=RING.indexOf(dp)-RING.indexOf(xp8);
  RING.forEach((p,i)=>{cells[RING[(i+dshift+16)%8]].door=DOOR_HOME[p]});
  const g0=RING.indexOf(tgt);
  GODS.forEach((g,k)=>{cells[RING[yang?(g0+k)%8:(g0-k+16)%8]].god=g});
  const xz=(xun*10)%12, empty=[(xz+10)%12,(xz+11)%12];
  const Z2P=[1,8,8,3,4,4,9,2,2,7,6,6];
  const hz=ZHI.indexOf(hourGZ[1]);
  const maZ=[2,8,11,5][Math.floor([8,0,4,2,6,10,5,9,1,11,3,7].indexOf(hz)/3)]; // 申子辰→寅 寅午戌→申 巳酉丑→亥 亥卯未→巳
  for(const c of Object.values(cells)){
    c.kong=empty.some(z=>Z2P[z]===c.p); c.ma=Z2P[maZ]===c.p;
    const st=STAR_S[c.star.split('‧')[0]][0], dr=DOOR_S[c.door][0], gd=GOD_S[c.god][0];
    c.po=(DOOR_WX[c.door]+2)%5===PAL_WX[c.p]; // 門迫：門剋宮
    c.score=dr*1.5+st+gd-(c.kong?1:0)-(c.po&&dr>0?1:0);
  }
  return {lunar,jq,yang,ju,yuan:'上中下'[yuan],dayGZ,hourGZ,xunYi,zhiFu,zhiShi,earth5:earth[5],cells,
    kong:empty.map(z=>ZHI[z]).join(''),maZ:ZHI[maZ]};
}

function derive(){
  const [y,m,d]=P.date.split('-').map(Number);
  const hh=P.hour===0?0:P.hour===12?23:P.hour*2-1;
  const solar=Solar.fromYmdHms(y,m,d,hh,30,0), lunar=solar.getLunar(), ec=lunar.getEightChar();
  const pillars=[ec.getYear(),ec.getMonth(),ec.getDay(),ec.getTime()];
  const dm=pillars[2][0], dmE=gWx(dm);
  const cnt=[0,0,0,0,0];let support=0;
  pillars.forEach((p,i)=>{const a=gWx(p[0]),b=zWx(p[1]),wb=i===1?2:1;cnt[a]+=1;cnt[b]+=1;
    if(a===dmE||a===(dmE+4)%5)support+=1;if(b===dmE||b===(dmE+4)%5)support+=wb});
  const strong=support>=4.5;
  const xi=strong?[(dmE+2)%5,(dmE+1)%5]:[(dmE+4)%5,dmE];
  const ji=strong?[(dmE+4)%5,dmE]:[(dmE+3)%5,(dmE+2)%5];

  D={y,m,d,solar,lunar,ec,pillars,dm,dmE,cnt,support,strong,xi,ji,yun,astro,birthZ:pillars[0][1]};
}
function gzScore(gz){let s=3;const a=gWx(gz[0]),b=zWx(gz[1]);if(D.xi.includes(a))s+=1;if(D.ji.includes(a))s-=1;if(D.xi.includes(b))s+=.5;if(D.ji.includes(b))s-=.5;return Math.max(1,Math.min(5,s))}
function hash(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}

function analyse(lines){
  const base=lines.map(v=>v%2).join(''), chg=lines.map(v=>v===9?0:v===6?1:v%2).join('');
  const hu=base.slice(1,4)+base.slice(2,5);
  const bi=HEXMAP[base], ci=HEXMAP[chg], hi=HEXMAP[hu];
  const mv=lines.map((v,i)=>v===6||v===9?i:-1).filter(i=>i>=0);
  const n=mv.length, sb=HEX[bi][6], sc=HEX[ci][6];
  let rule, focus, score;
  const still=[0,1,2,3,4,5].filter(i=>!mv.includes(i));
  if(n===0){rule='六爻皆靜，以本卦卦辭為斷。';focus=[];score=sb}
  else if(n===1){rule=`一爻動，以本卦${YAO_POS[mv[0]]}為斷。`;focus=[mv[0]];score=sb}
  else if(n===2){rule=`兩爻動，以本卦兩動爻為斷，以上方的${YAO_POS[mv[1]]}為主。`;focus=[mv[1],mv[0]];score=sb}
  else if(n===3){rule='三爻動，本卦為體、變卦為用，兩卦卦辭合參。';focus=mv;score=Math.round((sb+sc)/2)}
  else if(n===4){rule=`四爻動，以變卦兩靜爻為斷，以下方的${YAO_POS[still[0]]}為主。`;focus=still;score=Math.round(sc*.7+sb*.3)}
  else if(n===5){rule=`五爻動，以變卦唯一靜爻${YAO_POS[still[0]]}為斷。`;focus=still;score=Math.round(sc*.7+sb*.3)}
  else{rule=bi===0?'六爻全動，乾卦看「用九：見群龍无首，吉」。':bi===1?'六爻全動，坤卦看「用六：利永貞」。':'六爻全動，以變卦卦辭為斷。';focus=[];score=sc}
  return {lines,bi,ci,hi,mv,n,rule,focus,score};
}
function linesHtml(bits,mv=[],marks){return `<div class="lines">${[...bits].map((b,i)=>`<div class="ln${mv.includes(i)?' mv':''}">${b==='1'?'<span></span>':'<span></span><span></span>'}${marks&&mv.includes(i)?`<i class="mk">${marks[i]}</i>`:''}</div>`).join('')}</div>`}
function hexBits(i){const h=HEX[i];return TRI[h[2]]+TRI[h[1]]}

function yearGZ(y){return GAN[((y-4)%10+10)%10]+ZHI[((y-4)%12+12)%12]}
function yearInfo(y){
  const gz=yearGZ(y), ss=shishen(D.dm,gz[0]);
  const bz=ZHI.indexOf(D.birthZ), yz=ZHI.indexOf(gz[1]);
  const HAI={0:7,7:0,1:6,6:1,2:5,5:2,3:4,4:3,8:11,11:8,9:10,10:9};
  const tai=bz===yz?'值太歲（本命年）':Math.abs(bz-yz)===6?'沖太歲':HAI[bz]===yz?'害太歲':'';
  let score=gzScore(gz)-(tai.startsWith('值')||tai==='沖太歲'?1:tai?.5:0);
  let zw=null;
  if(D.astro){try{const Y=D.astro.horoscope(new Date(y,6,1)).yearly;const yi=Y.palaceNames.indexOf('命宮');
    const where=Y.mutagen.map(s=>D.astro.palaces.findIndex(p=>[...p.majorStars,...p.minorStars].some(x=>x.name===s)));
    if(where[0]===yi)score+=.5; if(where[3]===yi||where[3]===(yi+6)%12)score-=.5;
    zw={palace:D.astro.palaces[yi].name,mut:Y.mutagen,where:where.map(i=>i>=0?D.astro.palaces[i].name:'—'),yi}}catch(e){}}
  score=Math.max(1,Math.min(5,Math.round(score*2)/2));
  return {y,gz,ss,tai,score,zw,age:y-D.lunar.getYear()+1};
}

function strokesOf(ch){return (nameOverride&&nameOverride[ch])||KX[ch]||0}
function nameAnalysis(sur,given){
  const S=[...sur].map(strokesOf), G=[...given].map(strokesOf);
  const ok=S.length&&G.length&&[...S,...G].every(n=>n>0);
  if(!ok)return {ok:false,S,G};
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const tian=S.length===1?S[0]+1:sum(S), ren=S[S.length-1]+G[0], di=G.length===1?G[0]+1:sum(G);
  const zong=sum(S)+sum(G), wai=tian+di-ren;
  const g={tian,ren,di,wai,zong};
  const pt=n=>({吉:100,半:65,凶:25}[n81(n)[0]]);
  const e=[numWx(tian),numWx(ren),numWx(di)];
  const r1=rel(e[0],e[1]), r2=rel(e[1],e[2]);
  const sc=r=>({生:100,被生:90,比和:85,剋:55,被剋:35}[r]);
  const sancai=Math.round((sc(r1)+sc(r2))/2);
  let score=Math.round(pt(ren)*.3+pt(di)*.2+pt(zong)*.3+pt(wai)*.1+sancai*.1);
  return {ok,S,G,g,e,r1,r2,sancai,score};
}

  <div><div class="eyebrow">姓名學</div><h2 class="h2">一個名字，五種格局</h2></div>
  <div class="card stack">
    <div class="grid2"><label class="f" for="nmSur">姓<input id="nmSur" maxlength="2" value="${esc(sur)}"></label><label class="f" for="nmGiven">名<input id="nmGiven" maxlength="3" value="${esc(given)}"></label></div>
    <div class="namegrid">${[...sur].length===1?virt():''}${chars.map((x,i)=>`<div class="ch"><div class="c">${esc(x.c)}</div><input type="number" min="1" max="64" aria-label="${esc(x.c)}的筆畫" data-ch="${esc(x.c)}" value="${x.n||''}" placeholder="?"><small>${x.t}</small></div>`).join('')}${[...given].length===1?virt():''}</div>
    <p class="small muted">筆畫依康熙字典計算（氵算水4、艹算艸6、扌算手4、阝依阜邑）。查無的字可自行填入。</p>
  </div>${body}`;
}

/* ---------- 視圖：奇門 ---------- */
function renderQimen(){
  const t=qmTime||new Date(), Q=qimen(t);
  const [kind,key]=QM_USE[qmCat];
  const use=Object.values(Q.cells).find(c=>kind==='door'?c.door===key:kind==='god'?c.god===key:c.star.startsWith(key))||Object.values(Q.cells).find(c=>c.star.includes('禽'));
  const best=Object.values(Q.cells).sort((a,b)=>b.score-a.score)[0];
  const order=[4,9,2,3,5,7,8,1,6];
  const pad=n=>String(n).padStart(2,'0');
  const dtv=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T${pad(t.getHours())}:${pad(t.getMinutes())}`;
  const grid=order.map(p=>{if(p===5)return `<div class="qc c5"><b style="font-family:var(--f-display);font-size:15px">中五宮</b><span class="small muted">寄坤二</span><span class="small">地盤 ${Q.earth5}</span></div>`;
    const c=Q.cells[p];const isUse=c===use,isBest=c===best;
    return `<div class="qc${isUse?' use':''}${isBest?' best':''}">${isUse?`<span class="flag">用神</span>`:isBest?`<span class="flag g">吉方</span>`:''}
      <span class="god">${c.god}</span><span class="hs">${c.heaven}</span>
      <div class="mid"><span class="st">${c.star}</span><span class="dr ${DOOR_S[c.door][0]>0?'good-t':DOOR_S[c.door][0]<0?'bad-t':''}">${c.door}門</span>${c.kong||c.ma?`<span class="kong">${c.kong?'空亡':''}${c.kong&&c.ma?' ':''}${c.ma?'<span class="good-t">驛馬</span>':''}</span>`:''}</div>
      <span class="pal">${PAL[p][0]}${p} ${PAL[p][1]}</span><span class="es">${c.earth}</span></div>`}).join('');
  const uS=STAR_S[use.star.split('‧')[0]], uD=DOOR_S[use.door], uG=GOD_S[use.god];
  const us=use.score, uLv=us>=3?['good','可行']:us>=0?['mid','謹慎可行']:['bad','暫緩'];
  $('#v-qimen').innerHTML=`
  <div><div class="eyebrow">奇門遁甲 · 時家轉盤 · 拆補法</div><h2 class="h2">此時此刻，往哪裡走</h2></div>
  <div class="card stack">
    <div class="grid2"><label class="f" for="qmT">起局時間<input id="qmT" type="datetime-local" value="${dtv}"></label><div class="f"><span>　</span><button type="button" class="btn" id="qmNow">回到現在</button></div></div>
    <div class="chips" role="group" aria-label="所問之事">${CATS.map(c=>`<button type="button" class="chip" data-qc="${c}" aria-pressed="${c===qmCat}">${c}</button>`).join('')}</div>
    <p class="small muted">${Q.jq} · ${Q.yang?'陽':'陰'}遁${'一二三四五六七八九'[Q.ju-1]}局（${Q.yuan}元）· ${Q.dayGZ}日 ${Q.hourGZ}時 · 旬首${Q.xunYi} · 值符${Q.zhiFu} · 值使${Q.zhiShi}門 · 空亡${Q.kong} · 馬星${Q.maZ}</p>
  </div>
  <div class="qm" aria-label="奇門九宮盤（上南下北）">${grid}</div>
  <p class="small muted">盤面上南下北、左東右西。每宮左上為八神、右上天盤干、右下地盤干。</p>
  <div class="card stack">
    <div class="row between"><div><div class="eyebrow">問${qmCat} · 用神${kind==='door'?key+'門':key}</div><h3 class="h3">用神落${PAL[use.p][0]}${use.p}宮 · ${PAL[use.p][1]}方</h3></div><span class="pill ${uLv[0]}">${uLv[1]}</span></div>
    <p><b>${use.door}門</b>：${uD[1]}。<b>${use.star}</b>：${uS[1]}。<b>${use.god}</b>：${uG[1]}。</p>
    ${use.kong?'<p class="bad-t">用神落空亡：事情虛而不實，或時機未到，宜等出空（過了這個時辰／旬）再行動。</p>':''}
    ${use.po?`<p class="mid-t">${use.door}門受宮所迫（門迫），${DOOR_S[use.door][0]>0?'吉門被迫，好處打折扣。':'凶上加凶，宜避開。'}</p>`:''}
    ${use.ma?'<p class="good-t">逢驛馬，事情變動快，利出行與跑動。</p>':''}
    <div class="reader"><div class="seal" aria-hidden="true">遁</div><p>${us>=3?`此時${qmCat}之事可行，往${PAL[use.p][1]}方向或在此時辰行動最有利。`:us>=0?`${qmCat}之事吉凶參半，可行但要準備備案；若能選擇，改走${PAL[best.p][1]}方較順。`:`此時不利${qmCat}，建議換個時辰再看，或往${PAL[best.p][1]}方（${best.door}門）借力。`}</p></div>
  </div>
  <div class="card flat stack"><h3 class="h3">此時最佳方位：${PAL[best.p][1]}</h3><p class="small">${best.door}門・${best.star}・${best.god}。談事、出門、坐位面向這個方位，借一點天時地利。</p></div>`;
}

/* ---------- 導航 ---------- */
const VIEWS=['overview','yijing','ziwei','liunian','name','qimen'];
let cur='overview';
function go(v,push=true){
  if(!VIEWS.includes(v))v='overview';cur=v;
  $$('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  $$('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.v===v?'page':'false'));
  render(v);
  if(push)try{history.replaceState(null,'','#'+v)}catch(e){}
  window.scrollTo({top:0});
  store.set('gx_tab',v);
}
function render(v){({overview:renderOverview,yijing:renderYijingForm,ziwei:renderZiwei,liunian:renderLiunian,name:renderName,qimen:renderQimen})[v]()}
function updateHeader(){
  $('#whoName').textContent=P.sur+P.given+(P.sample?'（範例）':'');
  $('#whoAv').textContent=SX[ZHI.indexOf(D.birthZ)];
  const L=Solar.fromDate(new Date()).getLunar();
  $('#todayLine').textContent=`${L.getYearInGanZhi()}年 ${S2T(L.getMonthInChinese())}月${S2T(L.getDayInChinese())} · ${S2T(L.getPrevJieQi(true).getName())}`;
}

/* ---------- 命主表單 ---------- */
function openSheet(){
  $('#pSur').value=P.sur;$('#pGiven').value=P.given;$('#pDate').value=P.date;
  $('#pHour').innerHTML=HOURS.map((h,i)=>`<option value="${i}"${i===P.hour?' selected':''}>${h}</option>`).join('');
  $$('#pGender button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===P.gender));
  $('#sheetBack').hidden=false;setTimeout(()=>$('#pSur').focus(),50);
}
function closeSheet(){$('#sheetBack').hidden=true}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('tab'))return go(t.dataset.v);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.id==='whoBtn'||t.dataset.act==='profile')return openSheet();
  if(t.id==='pCancel')return closeSheet();
  if(t.dataset.g){$$('#pGender button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(t.dataset.act==='daily'){
    const bi=+t.dataset.h, m=+t.dataset.m;const bits=hexBits(bi);
    const lines=[...bits].map((b,i)=>i===m?(b==='1'?9:6):(b==='1'?7:8));
    go('yijing');const r=analyse(lines);$('#yjResult').innerHTML=readingHtml(r,{method:'每日一卦',time:'今日',q:'',cat:'綜合'});return;
  }
  if(t.dataset.cat){yjCat=t.dataset.cat;$$('#yjCats .chip').forEach(c=>c.setAttribute('aria-pressed',c===t));return}
  if(t.dataset.m&&t.closest('#yjMethod')){yjMethod=t.dataset.m;tossLines=[];renderYijingForm();return}
  if(t.id==='tossBtn'){if(tossLines.length>=6)return;const r=tossOne();showCoins(r.c);t.disabled=true;
    setTimeout(()=>{tossLines.push(r.v);const done=tossLines.length;$('#yao').insertAdjacentHTML('beforeend',yaoRow(r.v,done-1));
      t.disabled=done>=6;t.textContent=done>=6?'六爻已成':`擲第 ${done+1} 爻（${YAO_POS[done]}）`;$('#tossAll').textContent='重新起卦';
      if(done===6)finishCast(tossLines.slice(),'銅錢六擲')},matchMedia('(prefers-reduced-motion: reduce)').matches?0:720);return}
  if(t.id==='tossAll'){tossLines=[];let last;for(let i=0;i<6;i++){last=tossOne();tossLines.push(last.v)}renderYijingForm();showCoins(last.c);finishCast(tossLines.slice(),'銅錢六擲');return}
  if(t.id==='timeCast'){const L=Solar.fromDate(new Date()).getLunar();const Y=ZHI.indexOf(L.getYearZhi())+1,M=Math.abs(L.getMonth()),Dd=L.getDay(),Hr=ZHI.indexOf(L.getTimeZhi())+1;
    finishCast(meihua(Y+M+Dd,Y+M+Dd+Hr,Y+M+Dd+Hr),'時間起卦');return}
  if(t.id==='numCast'){const a=+$('#n1').value||1,b=+$('#n2').value||1,c=+$('#n3').value||1;finishCast(meihua(a,b,a+b+c),'報數起卦');return}
  if(t.dataset.hist!==undefined){const x=store.get('gx_hist',[])[+t.dataset.hist];if(x){$('#yjResult').innerHTML=readingHtml(analyse(x.lines),x.meta);$('#yjResult').scrollIntoView({behavior:'smooth'})}return}
  if(t.id==='yjClear'){store.set('gx_hist',[]);renderHist();toast('紀錄已清除');return}
  if(t.dataset.pal!==undefined){zwSel=+t.dataset.pal;renderZiwei();return}
  if(t.dataset.zy!==undefined){zwYearOn=t.dataset.zy==='1';renderZiwei();return}
  if(t.dataset.yr){lnYear=+t.dataset.yr;renderLiunian();return}
  if(t.dataset.qc){qmCat=t.dataset.qc;renderQimen();return}
  if(t.id==='qmNow'){qmTime=null;renderQimen();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nmSur'||t.id==='nmGiven'){clearTimeout(renderName.t);renderName.t=setTimeout(()=>{const id=t.id,pos=t.selectionStart;renderName();const el=$('#'+id);el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}},350)}
  if(t.dataset&&t.dataset.ch){nameOverride=nameOverride||{};nameOverride[t.dataset.ch]=+t.value||0;clearTimeout(renderName.t);renderName.t=setTimeout(()=>{const ch=t.dataset.ch;renderName();const el=$(`input[data-ch="${CSS.escape(ch)}"]`);if(el)el.focus()},500)}
});
document.addEventListener('change',e=>{if(e.target.id==='qmT'&&e.target.value){const d=new Date(e.target.value);if(!isNaN(d)){qmTime=d;renderQimen()}}});
$('#sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetBack').hidden)closeSheet()});
$('#pForm').addEventListener('submit',e=>{
  e.preventDefault();
  const g=$('#pGender button[aria-pressed="true"]');
  const np={sur:$('#pSur').value.trim(),given:$('#pGiven').value.trim(),gender:g?g.dataset.g:P.gender,date:$('#pDate').value,hour:+$('#pHour').value,sample:false};
  if(!np.sur||!np.given||!np.date){toast('請填寫姓名與生日');return}
  const yy=+np.date.slice(0,4);if(yy<1900||yy>2099){toast('生日請在 1900–2099 年之間');return}
  P=np;store.set('gx_profile',P);nameOverride=null;zwSel=null;$('#v-name').innerHTML='';
  derive();updateHeader();closeSheet();go(cur,false);toast('命盤已更新');
});

/* ---------- 啟動 ---------- */
function boot(){
  if(!window.Solar||!window.iztro){$('#boot').textContent='命理曆法元件載入失敗，請檢查網路後重新整理。';return}
  try{derive()}catch(err){console.error(err);P=SAMPLE;derive()}
  $('#boot').remove();updateHeader();
  const h=(location.hash||'').slice(1);go(VIEWS.includes(h)?h:store.get('gx_tab','overview'),false);
}
boot();
})();
</script>
