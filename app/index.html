<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文獻回顧加速器 | Research Accelerator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Academic Fonts: Inter (UI), Merriweather (Reading), Playfair Display (Headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563EB', // Brighter Blue for "Tech/Speed" feel (Royal Blue)
              secondary: '#64748B', // Slate
              accent: '#F59E0B', // Amber for highlights
              background: '#F8FAFC', // Cool grey background
              paper: '#FFFFFF', // Pure white
              surface: '#FFFFFF',
              ink: '#0F172A', // Slate 900
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Merriweather', 'Georgia', 'serif'],
              display: ['Playfair Display', 'serif'],
            },
            boxShadow: {
              'academic': '0 2px 10px rgba(0, 0, 0, 0.05), 0 10px 25px rgba(0, 0, 0, 0.05)',
              'hover': '0 10px 30px rgba(37, 99, 235, 0.1)', // Blue-tinted shadow
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #F8FAFC;
        color: #0F172A;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
</head>

        <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>

</html>
