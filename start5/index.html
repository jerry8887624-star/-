<head>

<title>先動五分鐘</title>
<style>/* ===== 主題變數：淺色（日）／深色（夜）兩組，改配色只動這裡 ===== */
:root{
  --bg:#F4EFE3;--card:rgba(255,253,248,.9);--card2:#F5EFE3;--line:rgba(176,140,70,.24);--ink:#22283A;--muted:#575C6B;
  --tint:#8E621C;--tint-soft:rgba(176,132,60,.14);--good:#2B6537;--bad:#A61F15;
  --gold:linear-gradient(180deg,#F6E3B6,#E0BB76);--gold-ink:#3A2810;--seg-act:linear-gradient(180deg,#F8E8C4,#EACA8C);--seg-ink:#3A2810;
  --bar:rgba(255,253,248,.94);--shadow:0 6px 22px rgba(110,90,50,.08);
  --bg-img:radial-gradient(120% 60% at 80% 0%,#DCE8EE 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#E6EDE6 0%,transparent 60%);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);--r:18px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11143A;--card:rgba(20,24,62,.84);--card2:#242A60;--line:rgba(226,190,120,.24);--ink:#F1E9D8;--muted:#C2BDD0;
  --tint:#E6C27E;--tint-soft:rgba(230,194,126,.16);--good:#A3D4AE;--bad:#FFAAA1;
  --gold:linear-gradient(180deg,#F0D49A,#C99A4E);--gold-ink:#24180A;--seg-act:linear-gradient(180deg,rgba(222,184,112,.36),rgba(130,98,50,.36));--seg-ink:#F7E3B6;
  --bar:rgba(14,17,46,.94);--shadow:0 10px 30px rgba(0,0,0,.32);
  --bg-img:radial-gradient(120% 60% at 80% 0%,#2A2F72 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#1D2458 0%,transparent 60%);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11143A;--card:rgba(20,24,62,.84);--card2:#242A60;--line:rgba(226,190,120,.24);--ink:#F1E9D8;--muted:#C2BDD0;
  --tint:#E6C27E;--tint-soft:rgba(230,194,126,.16);--good:#A3D4AE;--bad:#FFAAA1;
  --gold:linear-gradient(180deg,#F0D49A,#C99A4E);--gold-ink:#24180A;--seg-act:linear-gradient(180deg,rgba(222,184,112,.36),rgba(130,98,50,.36));--seg-ink:#F7E3B6;
  --bar:rgba(14,17,46,.94);--shadow:0 10px 30px rgba(0,0,0,.32);
  --bg-img:radial-gradient(120% 60% at 80% 0%,#2A2F72 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#1D2458 0%,transparent 60%);color-scheme:dark}

*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:16px/1.6 var(--ui);-webkit-font-smoothing:antialiased}
.bgart{position:fixed;inset:0;z-index:-1;background-color:var(--bg);background-image:var(--bg-img)}
.app{max-width:600px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
/* 導覽列與大標題 */
.navbar{position:sticky;top:0;z-index:8;display:grid;grid-template-columns:minmax(44px,1fr) auto minmax(44px,1fr);align-items:center;min-height:52px;margin:0 -16px;padding:env(safe-area-inset-top) 16px 0}
.collapsed .navbar{background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 1px 0 var(--line)}
#navTitle{font-family:var(--serif);font-weight:700;opacity:0;transition:opacity .2s}.collapsed #navTitle{opacity:1}
.nbtn{height:38px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-weight:700}
.nbtn.r{justify-self:end}.nbtn.l{justify-self:start}
.largetitle{padding:6px 0 18px}
.largetitle small{color:var(--tint);font:600 14px var(--serif);letter-spacing:.16em}
.largetitle h1{margin:2px 0;font:700 clamp(38px,11vw,52px)/1.15 var(--serif);letter-spacing:.08em}
.largetitle p{margin:0;font:14.5px var(--serif);letter-spacing:.28em;color:var(--muted)}
/* 卡片、按鈕、分段 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.h3{margin:0 0 6px;font:700 19px var(--serif)}.muted{color:var(--muted)}.small{font-size:14px}.eyebrow{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 18px;cursor:pointer;font-weight:700;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--tint);transition:transform .12s}
.btn.primary{background:var(--gold);color:var(--gold-ink);box-shadow:0 4px 14px rgba(170,125,50,.25)}
.btn.block{display:block;width:100%}.btn:active,.qk:active,.tab:active{transform:scale(.97)}
.seg{display:flex;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:10px 6px;font:600 16px var(--serif);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-act);color:var(--seg-ink);box-shadow:inset 0 0 0 1px var(--line)}
/* 快速入口 */
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px}.quick .qk{flex:0 0 calc(25% - 5px)}
.qk{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-weight:600;font-size:14px;min-height:64px;min-width:0;text-align:center;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.qk .qi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--tint-soft);color:var(--tint);font-size:22px}
/* 底部分頁列：往下捲收起 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px 22px 0 0;box-shadow:0 -1px 0 var(--line),0 -8px 26px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom);transition:transform .3s var(--ease)}
body.tabhide .tabbar{transform:translateY(calc(100% + 2px))}
.tabbar nav{max-width:600px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 12px;cursor:pointer;color:var(--muted);font-size:11px}
.tab .ti{font-size:22px;line-height:1}.tab[aria-current="page"]{color:var(--tint)}
.tab[aria-current="page"] span:last-child{position:relative}.tab[aria-current="page"] span:last-child::after{content:"";position:absolute;left:50%;bottom:-6px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--tint)}
/* 底部面板、提示、彈窗 */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.layer .scrim{position:absolute;inset:0;background:rgba(6,10,24,.45)}
.sheet{position:relative;width:100%;max-width:600px;max-height:88vh;overflow:auto;background-color:var(--bg);background-image:var(--bg-img);border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));animation:up .32s var(--ease)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheet-h b{font:700 19px var(--serif)}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--tint-soft);cursor:pointer}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;animation:up .25s var(--ease)}
.updm{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.updm .box{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;animation:up .4s var(--ease)}
.updm .card{padding:26px 22px}.updm h2{margin:0 0 6px;text-align:center;font:700 24px var(--serif)}.updm h2 span{display:inline-block;margin-right:8px;padding:0 12px;border-radius:999px;background:var(--tint-soft);color:var(--tint)}
.updm ol{list-style:none;counter-reset:u;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.updm li{counter-increment:u;position:relative;padding-left:38px}.updm li::before{content:counter(u);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tint-soft);color:var(--tint);font-weight:700}
.updm li b{display:block;font-family:var(--serif)}.updm li span{color:var(--muted);font-size:14.5px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* 動效 */
@media (prefers-reduced-motion:no-preference){.view:not([hidden]){animation:vin .22s var(--ease)}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
html.lowmo *,html.lowmo *::before,html.lowmo *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
html.theming *{transition:background-color .3s,color .3s,border-color .3s!important}
/* 注意：background 簡寫中顏色必須放在最後一層，混用變數時請分開寫 background-color／background-image */
.sheet .card b{display:block;margin:6px 0}

/* ===== 先動五分鐘：主題（暖橘火苗）===== */
:root{
  --bg:#F7F1E8;--card:rgba(255,252,247,.92);--card2:#F6ECDF;--line:rgba(210,120,60,.22);--ink:#2B2320;--muted:#5E5550;
  --tint:#B2461A;--tint-soft:rgba(240,120,60,.13);
  --gold:linear-gradient(180deg,#FFB067,#F0763A);--gold-ink:#2A1205;--seg-act:linear-gradient(180deg,#FFE0C2,#FFC796);--seg-ink:#3A1A08;
  --bar:rgba(255,251,245,.95);--shadow:0 6px 22px rgba(140,80,40,.09);
  --bg-img:radial-gradient(110% 55% at 85% 0%,#FFE2C8 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#F3E6D4 0%,transparent 60%);
  --focus-bg:radial-gradient(90% 60% at 50% 38%,#FFE6CC 0%,#F7EFE4 55%,#F1E6D8 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17131C;--card:rgba(36,28,40,.86);--card2:#2C2230;--line:rgba(255,160,90,.2);--ink:#F6EDE4;--muted:#C9BCB4;
  --tint:#FFB27A;--tint-soft:rgba(255,150,80,.15);
  --gold:linear-gradient(180deg,#FFAE66,#E8692E);--gold-ink:#220E03;--seg-act:linear-gradient(180deg,rgba(255,160,90,.38),rgba(170,80,30,.38));--seg-ink:#FFE3CC;
  --bar:rgba(24,19,28,.95);--shadow:0 10px 30px rgba(0,0,0,.35);
  --bg-img:radial-gradient(110% 55% at 85% 0%,#3B2430 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#2A1E2A 0%,transparent 60%);
  --focus-bg:radial-gradient(90% 60% at 50% 38%,#4A2A22 0%,#1E1620 55%,#140F17 100%)}}
:root[data-theme="dark"]{
  --bg:#17131C;--card:rgba(36,28,40,.86);--card2:#2C2230;--line:rgba(255,160,90,.2);--ink:#F6EDE4;--muted:#C9BCB4;
  --tint:#FFB27A;--tint-soft:rgba(255,150,80,.15);
  --gold:linear-gradient(180deg,#FFAE66,#E8692E);--gold-ink:#220E03;--seg-act:linear-gradient(180deg,rgba(255,160,90,.38),rgba(170,80,30,.38));--seg-ink:#FFE3CC;
  --bar:rgba(24,19,28,.95);--shadow:0 10px 30px rgba(0,0,0,.35);
  --bg-img:radial-gradient(110% 55% at 85% 0%,#3B2430 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#2A1E2A 0%,transparent 60%);
  --focus-bg:radial-gradient(90% 60% at 50% 38%,#4A2A22 0%,#1E1620 55%,#140F17 100%)}
.btn.primary{box-shadow:0 6px 18px rgba(240,110,50,.28)}
.largetitle h1{letter-spacing:.04em}
/* 首頁 */
.hero{position:relative;padding-top:20px}
.hero-ember{float:right;width:64px;margin:-6px -2px 0 8px}
label.h3{display:block}
.inp{width:100%;margin:12px 0 10px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font:17px var(--ui);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--tint);box-shadow:0 0 0 4px var(--tint-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:15px;color:var(--ink);transition:transform .12s}
.chip:active{transform:scale(.96)}
.btn.big{padding:16px 18px;font-size:17px;border-radius:16px}
.btn.sm{padding:8px 14px;font-size:14px;white-space:nowrap}
.stat-row{display:flex;align-items:center;gap:18px}.stat-row>div{display:flex;flex-direction:column;line-height:1.2}.stat-row b{font:700 26px var(--serif);color:var(--tint)}.stat-row span{font-size:13px;color:var(--muted)}.stat-row .btn{margin-left:auto}
.linkbtn{border:0;background:none;color:var(--tint);font-weight:600;cursor:pointer;padding:8px 0;min-height:40px}
.linkbtn.danger{display:block;margin:0 auto 20px;color:var(--muted);font-size:14px;text-decoration:underline}
.center{text-align:center}
/* 計畫卡 */
.plan-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptask{font-size:22px;margin:0 0 12px;overflow-wrap:anywhere}
.first{border-radius:16px;padding:16px;background:var(--tint-soft);border:1.5px dashed var(--line);margin-bottom:12px}
.first p{margin:6px 0 0;font:700 21px/1.45 var(--serif)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--tint);letter-spacing:.06em}
.first.pop{animation:pop .42s var(--ease)}
@keyframes pop{0%{transform:scale(.94);opacity:.4}60%{transform:scale(1.02)}100%{transform:none;opacity:1}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.row2 .btn{padding:12px 8px}
.later{margin:0 0 14px;font-size:14.5px;color:var(--muted)}.later summary{cursor:pointer;padding:6px 0;min-height:36px}.later ol{margin:4px 0 0;padding-left:22px}
.lbl{display:block;margin:4px 0 8px;font-size:14px}
.plan .seg{margin-bottom:14px}.plan .seg button{font-size:15px}
/* 小火苗 */
.ember{display:block;width:100%;height:auto;overflow:visible}
.ember .eglow{fill:#FF9A4A;opacity:.22;filter:blur(10px)}
.ember .eye{fill:#5A2A10}
@media (prefers-reduced-motion:no-preference){
  .ember .ebody{transform-box:fill-box;transform-origin:50% 100%;animation:flick 2.6s ease-in-out infinite}
  .ember .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
  .ember .eglow{animation:glow 2.6s ease-in-out infinite}}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(1.03,.97) skewX(-1.5deg)}60%{transform:scale(.98,1.04) skewX(1.5deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes glow{0%,100%{opacity:.18}50%{opacity:.34}}
/* 專注畫面 */
.focus{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));background-color:var(--bg);background-image:var(--focus-bg);overflow:auto;text-align:center}
.focus>*{width:100%;max-width:440px}
.focus.enter{animation:fin .5s var(--ease)}
@keyframes fin{from{opacity:0;transform:scale(1.03)}}
.f-top{display:flex;flex-direction:column;gap:2px}.f-task{font:700 20px var(--serif);overflow-wrap:anywhere}
.f-mid{display:flex;flex-direction:column;align-items:center}
.ringwrap{position:relative;width:min(64vw,250px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;width:100%;height:100%}
.rbg{fill:none;stroke:var(--tint-soft);stroke-width:10}
.rfg{fill:none;stroke:#F27A3C;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ringwrap .ember{width:46%}
.f-time{margin-top:10px;font:700 52px/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.f-line{min-height:3em;margin:12px 0 0;font:17px/1.5 var(--serif);color:var(--muted)}
.f-line.swap{animation:lin .5s var(--ease)}@keyframes lin{from{opacity:0;transform:translateY(6px)}}
.f-step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.f-step p{margin:4px 0 2px;font:700 18px/1.45 var(--serif)}
.f-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f-btns.col{grid-template-columns:1fr}
.focus.paused .ember{filter:grayscale(.6) brightness(.9)}.focus.paused .ember .ebody{animation-play-state:paused}.focus.paused .f-time{opacity:.55}
/* 完成 */
.done{position:relative;padding-top:30px}.done .ember{width:120px}
.d-title{margin:14px 0 6px;font:700 34px var(--serif);color:var(--tint)}
.d-sub{margin:0;color:var(--muted);line-height:1.7}
.burst{position:absolute;left:50%;top:90px;width:0;height:0}
.burst i{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:#FFB45E;opacity:0;box-shadow:0 0 8px #FF9A4A}
.done.go .ember{animation:grow .7s var(--ease)}
.done.go .burst i{animation:spark .9s .1s var(--ease) forwards}
.done.go .d-title{animation:lin .5s .25s var(--ease) both}.done.go .d-sub{animation:lin .5s .4s var(--ease) both}
@keyframes grow{0%{transform:scale(.6)}55%{transform:scale(1.12)}100%{transform:none}}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1*var(--d)))}}
/* 紀錄 */
.jar-card{display:flex;align-items:center;gap:14px}
.jar{width:46%;max-width:190px;flex:none}
.jar .glass{fill:var(--tint-soft);stroke:var(--line);stroke-width:3}.jar .lid{fill:var(--line)}
.jar .spark{fill:url(#sp)}
@media (prefers-reduced-motion:no-preference){.jar .spark{animation:tw 3.2s ease-in-out infinite}}
@keyframes tw{50%{opacity:.6}}
.jar-empty{fill:var(--muted);font-size:15px}
.jar-txt{display:flex;flex-direction:column;line-height:1.25}.bign{font:700 54px/1.05 var(--serif);color:var(--tint)}
.jar-txt p{margin:8px 0 0}
.note{margin:-2px 4px 14px;font-size:14.5px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:8px}
.cal b{font-size:12.5px;color:var(--muted);font-weight:600}
.cal span{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:14px;color:var(--muted)}
.cal .on{background:var(--gold);color:var(--gold-ink);font-weight:700;box-shadow:0 0 12px rgba(255,140,60,.35)}
.cal .today{outline:2px solid var(--tint);outline-offset:-2px}
.cal i{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:var(--bg);font:700 11px/17px var(--ui);font-style:normal}
.rlist{list-style:none;margin:0;padding:0}.rlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.rlist li:first-child{border-top:0}
.rlist li>div{flex:1;min-width:0;display:flex;flex-direction:column}.rlist b{overflow-wrap:anywhere}.rlist small{color:var(--muted);font-size:13px}
/* 心法 */
.tip summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;font-family:var(--serif);font-size:17px;min-height:28px}
.tip summary::-webkit-details-marker{display:none}.tip summary::after{content:"＋";color:var(--tint);flex:none}.tip[open] summary::after{content:"－"}
.tip p{margin:10px 0 6px}
.how{margin:6px 0 0;padding-left:22px}.how li{margin:4px 0}
body.focusing .tabbar{transform:translateY(calc(100% + 2px))}
.focus.isdone{justify-content:center;gap:40px}
.hero-h{display:flex;align-items:center;justify-content:space-between;gap:10px}.hero-h .h3{margin:0;font-size:21px}
.hero-ember{float:none;flex:none;width:52px;margin:-10px 0 -4px}</style>
</head>
<body>

<div class="bgart" aria-hidden="true"></div>
<div class="app">
  <header class="navbar"><button class="nbtn l" id="setBtn" aria-label="顯示設定">Aa</button><span id="navTitle" aria-hidden="true"></span><span></span></header>
  <div class="largetitle"><small id="ltSub"></small><h1 id="ltTitle"></h1><p id="ltTag"></p></div>
  <div id="subnav"></div>
  <main>
    <!-- 每個 view 一個 section；新增功能＝加 section＋在 GROUPS／render 登記 -->
    <section class="view" id="v-home" hidden></section>
    <section class="view" id="v-log" hidden></section>
    <section class="view" id="v-tips" hidden></section>
  </main>
</div>
<div class="tabbar"><nav id="tabs" aria-label="功能"></nav></div>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches||store.get('ax_motion','full')==='low';
const wait=ms=>new Promise(r=>setTimeout(r,reduceMotion()?0:ms));
function buzz(ms=8){if(store.get('ax_haptic',true)===false)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function toast(t){$('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function sheet(title,html){const L=document.createElement('div');L.className='layer';L.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><b>${title}</b><button class="x" data-close aria-label="關閉">×</button></div>${html}</div>`;
  L.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target.classList.contains('scrim'))L.remove()});document.body.appendChild(L);document.body.classList.add('modal-open');
  new MutationObserver(()=>{if(!L.isConnected)document.body.classList.remove('modal-open')}).observe(document.body,{childList:true});return L}

/* ===== App 內容：先動五分鐘 ===== */
const GROUPS=[
  {k:'home',n:'開始',icon:'▶︎',views:['home'],tag:'不用做完，先開始就好'},
  {k:'log',n:'紀錄',icon:'◎',views:['log'],tag:'每一次開始都算數'},
  {k:'tips',n:'心法',icon:'✎',views:['tips'],tag:'為什麼五分鐘有用'}];
const TITLES={home:'先動五分鐘',log:'我的火苗',tips:'起步心法'},SUBS={home:'START IN 5',log:'不算連續天數',tips:'拖延不是懶'};

/* ---------- 把任務拆成「小到不好意思不做」的第一步 ---------- */
const CATS=[
  {re:/程式|code|bug|debug|網站|app|系統|部署/i,steps:['打開專案，只看一眼上次停在哪','把要改的地方寫成一行待辦','只改一個最小的地方，存檔'],tiny:['打開電腦，開啟編輯器就好','只把專案資料夾打開','讀上次寫的最後 10 行']},
  {re:/回信|回覆|訊息|信件|email|mail|電話|聯絡|道歉|邀請|約/i,steps:['打開對話框，只打第一句','先寫三個重點，不用修飾','讀一遍，按下送出'],tiny:['只把對方的訊息點開','打下「你好」兩個字就好','先決定要說的一句話']},
  {re:/繳|報稅|申請|填|表單|預約|帳單|文件|辦理|保險|退貨/,steps:['把需要的資料找出來放桌上','打開網站或表格，看第一欄要填什麼','只填第一欄'],tiny:['只打開那個網站','把相關的信或單據找出來','把要辦的事寫在便條紙上']},
  {re:/打掃|整理|收拾|洗|倒垃圾|房間|衣服|碗|桌|冰箱|衣櫃|拖地|吸塵/,steps:['拿一個袋子，先撿 5 樣垃圾','只整理眼前一平方公尺','把一樣東西放回它的位置'],tiny:['站起來，走到那個地方','只撿起一樣東西','放一首歌，先站著看一下']},
  {re:/運動|跑步|健身|瑜伽|伸展|走路|散步|游泳|重訓|騎車|深蹲/,steps:['換上運動服','做 10 下最簡單的動作','出門走到巷口就好'],tiny:['把運動鞋拿出來放門口','只換上褲子','站起來伸個懶腰']},
  {re:/讀|唸|念書|考|複習|背|單字|上課|課本|講義|學|題目/,steps:['翻到上次讀到的那一頁','只讀一頁，劃一個重點','做一題最簡單的題目'],tiny:['把書拿出來放在桌上','只翻開書','讀第一句就好']},
  {re:/報告|論文|文章|企劃|簡報|作業|稿|寫|履歷|心得|日記|提案/,steps:['打開檔案，只寫下標題','列出 3 個想講的重點（關鍵字就好）','挑最簡單的一段，寫爛也沒關係'],tiny:['打開電腦，開一個空白檔案','只把檔名取好','寫一句「這份要講的是……」']},
  {re:/畫|練習|琴|吉他|唱|拍照|剪片|影片|設計|手作|烘焙|煮/,steps:['把工具拿出來擺好','只做 1 分鐘暖身','做最簡單的一小段'],tiny:['只把工具拿出來','打開教學或上次的作品看一眼','坐到位置上就好']}];
const GEN={steps:t=>[`把「${t}」需要的東西拿到面前`,`寫下「${t}」的第一個動作`,'只做那個動作，做到計時結束'],tiny:['站起來，走到要做事的地方','把手機翻面放遠一點','深呼吸三次，然後看著它']};
function breakdown(t){const c=CATS.find(c=>c.re.test(t));return c?{steps:c.steps.slice(),tiny:c.tiny.slice()}:{steps:GEN.steps(t),tiny:GEN.tiny.slice()}}
const PICKS=['寫報告','打掃房間','回訊息','讀書','運動','繳帳單'];

/* ---------- 狀態 ---------- */
const sess={get:()=>store.get('s5_sess',null),set:v=>store.set('s5_sess',v),clear:()=>{try{localStorage.removeItem('s5_sess')}catch(e){}}};
let plan=store.get('s5_plan',null),draft='';
const recs=()=>store.get('s5_recs',[]);
const saveRecs=r=>store.set('s5_recs',r.slice(-500));
const totalMin=r=>Math.round(r.reduce((a,x)=>a+(x.sec||0),0)/60);
const dur=()=>store.get('s5_dur',5);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const dKey=ts=>{const d=new Date(ts);return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
const nice=ts=>{const d=new Date(ts),n=new Date();const day=dKey(ts)===dKey(n)?'今天':dKey(ts)===dKey(n-864e5)?'昨天':`${d.getMonth()+1}/${d.getDate()}`;return`${day} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

/* ---------- 小火苗（陪伴角色）---------- */
const ember=(cls='')=>`<svg class="ember ${cls}" viewBox="0 0 120 150" aria-hidden="true"><defs><radialGradient id="eg${cls}" cx="50%" cy="70%" r="65%"><stop offset="0" stop-color="#FFE7A3"/><stop offset=".55" stop-color="#FF9E4A"/><stop offset="1" stop-color="#F0602E"/></radialGradient></defs>
  <ellipse class="eglow" cx="60" cy="100" rx="52" ry="44"/>
  <g class="ebody"><path d="M60 8C70 34 98 52 98 94a38 38 0 0 1-76 0c0-22 12-32 18-46 4 12 10 16 14 16C52 46 50 28 60 8z" fill="url(#eg${cls})"/>
  <path d="M60 64c6 12 20 18 20 34a20 20 0 0 1-40 0c0-12 10-18 20-34z" fill="#FFF1C8" opacity=".75"/>
  <g class="eface"><ellipse class="eye" cx="51" cy="98" rx="3.6" ry="4.6"/><ellipse class="eye" cx="69" cy="98" rx="3.6" ry="4.6"/><path d="M53 108q7 6 14 0" fill="none" stroke="#5A2A10" stroke-width="2.6" stroke-linecap="round"/></g></g></svg>`;

/* ---------- 頁面 ---------- */
const render={
  home:()=>{const r=recs();
    if(plan)return planCard()+recentCard(r);
    return `<div class="card hero"><div class="hero-h"><label class="h3" for="task">你在拖延什麼事？</label><div class="hero-ember">${ember('h')}</div></div><p class="muted small">說一件就好，我幫你找出最小的第一步。</p>
      <input id="task" class="inp" maxlength="40" autocomplete="off" enterkeyhint="go" placeholder="例如：寫期末報告" value="${esc(draft)}">
      <div class="chips" role="group" aria-label="常見的事">${PICKS.map(p=>`<button class="chip" data-a="pick" data-v="${p}">${p}</button>`).join('')}</div>
      <button class="btn primary block big" data-a="plan">幫我找出第一步</button></div>
      ${r.length?`<div class="card stat-row"><div><b>${r.length}</b><span>次開始</span></div><div><b>${totalMin(r)}</b><span>分鐘</span></div><button class="btn" data-go="log">看紀錄</button></div>`:''}
      ${recentCard(r)}${installCta()}`},
  log:()=>{const r=recs();
    return `<div class="card jar-card">${jar(r.length)}<div class="jar-txt"><span class="eyebrow">累積</span><b class="bign">${r.length}</b><span>次開始</span><p class="muted small">專注 ${totalMin(r)} 分鐘・完成 ${r.filter(x=>x.done).length} 輪</p></div></div>
      <p class="note">這裡不算「連續天數」。中斷不會歸零，每一次開始都會留下一顆火苗。</p>
      ${month(r)}
      <div class="card"><h3 class="h3">最近開始的事</h3>${r.length?`<ul class="rlist">${r.slice(-12).reverse().map(x=>`<li><div><b>${esc(x.task)}</b><small>${nice(x.ts)}・${x.sec>=60?Math.round(x.sec/60)+' 分鐘':(x.sec||0)+' 秒'}${x.done?'・完成一輪':''}</small></div><button class="btn sm" data-a="again" data-v="${esc(x.task)}" aria-label="再開始一次：${esc(x.task)}">再一次</button></li>`).join('')}</ul>`:`<p class="muted">還沒有紀錄。<button class="linkbtn" data-go="home">去開始第一次 →</button></p>`}</div>
      ${r.length?'<button class="linkbtn danger" data-a="wipe">清除所有紀錄</button>':''}`},
  tips:()=>TIPS.map(([t,d,src])=>`<details class="card tip"><summary><b>${t}</b></summary><p>${d}</p>${src?`<small class="muted">參考：${src}</small>`:''}</details>`).join('')
    +`<div class="card"><h3 class="h3">怎麼用最有效</h3><ol class="how"><li>寫下逃避的事，按「幫我找出第一步」。</li><li>覺得還是太難，就按「再小一點」，直到你覺得「這個我可以」。</li><li>按開始，只做這一步。時間到想停就停。</li><li>通常你會想繼續——那就選「再 5 分鐘」或「不計時繼續」。</li></ol></div>`};

const TIPS=[
 ['拖延不是懶，是在躲不舒服的感覺','研究發現，拖延多半是「短期情緒調節」：任務讓人焦慮、無聊或怕做不好，於是先逃開讓心情好一點。所以解法不是逼自己，而是讓開始變得不可怕。','Sirois & Pychyl（2013），Social and Personality Psychology Compass'],
 ['最難的是開始，不是過程','只要承諾 5 分鐘，大腦就不會把整件事當成一座山。真正開始後，多數人會發現沒那麼糟，自然想繼續做下去。',''],
 ['第一步要小到「不好意思不做」','行為設計研究指出：動機不穩定時，把行為縮到極小（例如只打開檔案），比靠意志力更可靠。','BJ Fogg《Tiny Habits》（2019）'],
 ['有人陪，比較做得下去','「陪伴工作」（body doubling）是很多人實際用的方法：身邊有人一起專注，就比較不容易分心。小火苗就是陪你的那個人。',''],
 ['原諒自己，下次更容易開始','一項針對大學生的研究：考前原諒自己拖延的人，下一次考試前拖延得比較少。責怪自己只會讓任務更可怕。','Wohl, Pychyl & Bennett（2010），Personality and Individual Differences']];

function planCard(){const p=plan,step=p.cur;const d=dur();
  return `<div class="card plan"><div class="plan-top"><span class="eyebrow">要開始的事</span><button class="linkbtn" data-a="reset">換一件事</button></div>
    <h3 class="h3 ptask">${esc(p.task)}</h3>
    <div class="first" aria-live="polite"><span class="tag">第一步${p.lv?`・縮小 ${p.lv} 次`:''}</span><p id="firstStep">${esc(step)}</p></div>
    <div class="row2"><button class="btn" data-a="smaller">太難了，再小一點</button><button class="btn" data-a="edit">我自己寫</button></div>
    ${p.lv===0?`<details class="later"><summary>之後的步驟（現在先不用管）</summary><ol>${p.steps.slice(1).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details>`:''}
    <b class="lbl">先做多久？</b><div class="seg" role="group" aria-label="時間">${[2,5,10].map(m=>`<button data-a="dur" data-v="${m}" aria-pressed="${d===m}">${m} 分鐘</button>`).join('')}</div>
    <button class="btn primary block big" data-a="start">開始 ${d} 分鐘</button>
    <p class="muted small center">時間到想停就停，不會有任何懲罰。</p></div>`}
function recentCard(r){const seen=[...new Set(r.slice().reverse().map(x=>x.task))].slice(0,4);if(!seen.length)return'';
  return `<div class="card"><span class="eyebrow">最近開始過</span><div class="chips">${seen.map(t=>`<button class="chip" data-a="again" data-v="${esc(t)}">↻ ${esc(t)}</button>`).join('')}</div></div>`}
function jar(n){let dots='';let s=7;const rnd=()=>(s=(s*9301+49297)%233280)/233280;const shown=Math.min(n,80);
  for(let i=0;i<shown;i++){const row=Math.floor(i/7),inRow=Math.min(7,shown-row*7),col=i%7,x=100+(col-(inRow-1)/2)*18+(rnd()-.5)*5,y=200-row*16-rnd()*5,r=6+rnd()*2.5;dots+=`<circle class="spark" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" style="animation-delay:${(rnd()*3).toFixed(2)}s"/>`}
  return `<svg class="jar" viewBox="0 0 200 220" role="img" aria-label="火苗罐，裝了 ${n} 顆火苗"><defs><radialGradient id="sp"><stop offset="0" stop-color="#FFF2B8"/><stop offset=".6" stop-color="#FFA552"/><stop offset="1" stop-color="#F06A2E" stop-opacity=".2"/></radialGradient></defs>
    <rect x="62" y="8" width="76" height="16" rx="5" class="lid"/><path d="M70 24h60v14c22 8 42 24 42 54v104a16 16 0 0 1-16 16H44a16 16 0 0 1-16-16V92c0-30 20-46 42-54z" class="glass"/>
    <g clip-path="url(#jc)">${dots}</g><clipPath id="jc"><path d="M70 24h60v14c22 8 42 24 42 54v104a16 16 0 0 1-16 16H44a16 16 0 0 1-16-16V92c0-30 20-46 42-54z"/></clipPath>
    ${n?'':'<text x="100" y="140" text-anchor="middle" class="jar-empty">還是空的</text>'}</svg>`}
function month(r){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();const cnt={};r.forEach(x=>{const k=dKey(x.ts);cnt[k]=(cnt[k]||0)+1});
  let cells='';for(let i=0;i<first;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){const c=cnt[`${y}-${m+1}-${d}`]||0;cells+=`<span class="dc${c?' on':''}${d===n.getDate()?' today':''}" ${c?`aria-label="${m+1}月${d}日開始 ${c} 次"`:''}>${d}${c>1?`<i>${c}</i>`:''}</span>`}
  const mc=r.filter(x=>{const d=new Date(x.ts);return d.getFullYear()===y&&d.getMonth()===m}).length;
  return `<div class="card"><div class="plan-top"><h3 class="h3">${m+1} 月</h3><span class="muted small">這個月開始 ${mc} 次</span></div><div class="cal"><b>日</b><b>一</b><b>二</b><b>三</b><b>四</b><b>五</b><b>六</b>${cells}</div></div>`}

function makePlan(t){t=t.trim().slice(0,40);if(!t){toast('先寫下一件事，或點下面的常見選項');$('#task')?.focus();return}
  const b=breakdown(t);plan={task:t,steps:b.steps,tiny:b.tiny,lv:0,cur:b.steps[0]};store.set('s5_plan',plan);draft='';buzz();go('home')}

/* ---------- 專注畫面：狀態機 run → done（→ flow）---------- */
const LINES=['只做這一步就好，我在這陪你。','很好，最難的「開始」已經過去了。','分心了也沒關係，回來就好。','過一半了，你正在做。','快到了，順順地做下去。','最後一下，不用完美。'];
let tick=null,wl=null;
async function keepAwake(on){try{if(on&&'wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}else if(!on&&wl){wl.release();wl=null}}catch(e){}}
function startSession(task,step,steps,min){const r=recs();const rec={id:Date.now(),task,step,ts:Date.now(),sec:0,done:false};r.push(rec);saveRecs(r);
  sess.set({task,step,steps:steps||[],min,recId:rec.id,mode:'run',endAt:Date.now()+min*60e3,left:null,acc:0,segStart:Date.now()});buzz(14);openFocus(true)}
function addSec(id,sec){const r=recs(),x=r.find(x=>x.id===id);if(x){x.sec=Math.round((x.sec||0)+sec);saveRecs(r)}}
function openFocus(fresh){let L=$('.focus');if(!L){L=document.createElement('div');L.className='focus';L.setAttribute('role','dialog');L.setAttribute('aria-modal','true');L.setAttribute('aria-label','專注中');document.body.appendChild(L);document.body.classList.add('modal-open','focusing')}
  const s=sess.get();if(!s)return closeFocus();
  if(s.mode==='done')return drawDone(L,s);
  const C=2*Math.PI*104;
  L.innerHTML=`<div class="f-top"><span class="eyebrow">${s.mode==='flow'?'不計時・順著做':'正在開始'}</span><b class="f-task">${esc(s.task)}</b></div>
    <div class="f-mid"><div class="ringwrap">${s.mode==='flow'?'':`<svg class="ring" viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="104" class="rbg"/><circle cx="120" cy="120" r="104" class="rfg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0" transform="rotate(-90 120 120)"/></svg>`}${ember('f')}</div>
      <div class="f-time" id="fTime" role="timer" aria-live="off">--:--</div>
      <p class="f-line" id="fLine" aria-live="polite">${LINES[0]}</p></div>
    <div class="f-step"><span class="tag">現在這一步</span><p id="fStep">${esc(s.step)}</p>${s.steps.length?'<button class="linkbtn" data-a="nextstep">這步做完了 → 下一步</button>':''}</div>
    <div class="f-btns"><button class="btn" data-a="pause">${s.left!=null?'繼續':'暫停'}</button><button class="btn" data-a="stop">${s.mode==='flow'?'結束':'先停在這裡'}</button></div>`;
  L.classList.remove('isdone');L.classList.toggle('paused',s.left!=null);if(fresh&&!reduceMotion())L.classList.add('enter');
  keepAwake(s.left==null);clearInterval(tick);tick=setInterval(upd,250);upd()}
function upd(){const s=sess.get(),L=$('.focus');if(!s||!L||s.mode==='done')return clearInterval(tick);
  const now=Date.now(),total=s.min*60;
  if(s.mode==='flow'){const el=(s.left!=null?s.left:(now-s.segStart)/1e3);$('#fTime').textContent=fmt(el);const li=Math.min(LINES.length-1,1+Math.floor(el/120));setLine(s.left!=null?'休息一下也可以，準備好再繼續。':LINES[li]);return}
  const left=s.left!=null?s.left:(s.endAt-now)/1e3;$('#fTime').textContent=fmt(left);
  const C=2*Math.PI*104,fg=L.querySelector('.rfg');if(fg)fg.setAttribute('stroke-dashoffset',(C*(1-Math.max(0,left)/total)).toFixed(1));
  const done=1-left/total;setLine(s.left!=null?'暫停中。準備好再按「繼續」。':LINES[Math.min(LINES.length-1,Math.floor(done*LINES.length))]);
  if(left<=0&&s.left==null)finish(true)}
function setLine(t){const e=$('#fLine');if(e&&e.textContent!==t){e.classList.remove('swap');void e.offsetWidth;e.textContent=t;e.classList.add('swap')}}
function finish(full){const s=sess.get();if(!s||s.mode==='done')return;clearInterval(tick);
  const now=Date.now();let sec;
  if(s.mode==='flow')sec=s.left!=null?s.left:(now-s.segStart)/1e3;
  else{const left=s.left!=null?s.left:(s.endAt-now)/1e3;sec=s.min*60-Math.max(0,left)}
  addSec(s.recId,sec);if(full&&s.mode==='run'){const r=recs(),x=r.find(x=>x.id===s.recId);if(x){x.done=true;saveRecs(r)}}
  s.mode='done';s.last=Math.round(sec);s.full=!!full;s.acc=(s.acc||0)+Math.round(sec);sess.set(s);keepAwake(false);
  buzz(full?[20,60,20]:12);if(full)chime();openFocus()}
function drawDone(L,s){const n=recs().length,acc=s.acc||0;const t=acc>=60?`${Math.floor(acc/60)} 分 ${acc%60} 秒`:`${acc} 秒`;
  L.classList.remove('paused');L.classList.add('isdone');
  L.innerHTML=`<div class="f-mid done"><div class="burst" aria-hidden="true">${Array.from({length:14},(_,i)=>`<i style="--a:${i*360/14}deg;--d:${60+(i%3)*22}px"></i>`).join('')}</div>${ember('d')}
    <h2 class="d-title">${s.full?'你開始了！':'這也算開始！'}</h2>
    <p class="d-sub">「${esc(s.task)}」做了 ${t}<br>這是你的第 ${n} 次開始，火苗罐又多一顆。</p></div>
    <div class="f-btns col"><button class="btn primary block big" data-a="more">再 ${s.min} 分鐘</button><button class="btn block" data-a="flow">不計時，順著做下去</button><button class="btn block" data-a="end">今天先到這裡</button></div>`;
  if(!reduceMotion()){L.querySelector('.done').classList.add('go')}}
function closeFocus(){clearInterval(tick);keepAwake(false);$('.focus')?.remove();document.body.classList.remove('modal-open','focusing')}
function chime(){if(store.get('s5_sound',true)===false)return;try{const A=new (window.AudioContext||window.webkitAudioContext)();[[660,0],[880,.16],[1320,.32]].forEach(([f,t])=>{const o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,A.currentTime+t);g.gain.linearRampToValueAtTime(.18,A.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+t+.9);o.connect(g).connect(A.destination);o.start(A.currentTime+t);o.stop(A.currentTime+t+1)});setTimeout(()=>A.close(),2000)}catch(e){}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='pick'){const i=$('#task');if(i){i.value=v;draft=v}return makePlan(v)}
  if(a==='plan')return makePlan($('#task')?.value||'');
  if(a==='again'){go('home');return makePlan(v)}
  if(a==='reset'){plan=null;store.set('s5_plan',null);return go('home')}
  if(a==='smaller'){const p=plan;if(p.lv<p.tiny.length){p.cur=p.tiny[p.lv];p.lv++}else{toast('已經是最小的一步了——現在就開始吧');return}store.set('s5_plan',p);buzz();go('home');const f=$('.first');if(f&&!reduceMotion()){f.classList.add('pop')}return}
  if(a==='edit'){const L=sheet('寫下你的第一步',`<div class="card"><p class="muted small">越小越好，例如「打開檔案」。</p><input id="ownStep" class="inp" maxlength="40" value="${esc(plan.cur)}"><button class="btn primary block" data-a="ownok">就做這個</button></div>`);setTimeout(()=>L.querySelector('#ownStep')?.select(),100);return}
  if(a==='ownok'){const t=$('#ownStep').value.trim();if(t){plan.cur=t;store.set('s5_plan',plan)}$('.layer')?.remove();return go('home')}
  if(a==='dur'){store.set('s5_dur',+v);return go('home')}
  if(a==='start'){const p=plan;const rest=p.lv?p.steps.slice():p.steps.slice(1);return startSession(p.task,p.cur,rest,dur())}
  const s=sess.get();if(!s)return;
  if(a==='pause'){if(s.left!=null){if(s.mode==='flow')s.segStart=Date.now()-s.left*1e3;else s.endAt=Date.now()+s.left*1e3;s.left=null}else{s.left=s.mode==='flow'?(Date.now()-s.segStart)/1e3:(s.endAt-Date.now())/1e3}sess.set(s);buzz();return openFocus()}
  if(a==='nextstep'){if(!s.steps.length)return;s.step=s.steps.shift();sess.set(s);buzz();toast('做得好！下一步');const p=$('#fStep');if(p){p.textContent=s.step;if(s.steps.length===0)b.remove()}return}
  if(a==='stop')return finish(false);
  if(a==='more'){Object.assign(s,{mode:'run',endAt:Date.now()+s.min*60e3,left:null});sess.set(s);buzz(14);return openFocus(true)}
  if(a==='flow'){Object.assign(s,{mode:'flow',segStart:Date.now(),left:null});sess.set(s);buzz();return openFocus(true)}
  if(a==='end'){sess.clear();plan=null;store.set('s5_plan',null);closeFocus();return go('log')}
});
document.addEventListener('click',e=>{if(e.target.closest('[data-a="wipe"]')&&confirm('確定清除所有紀錄？火苗罐會變空，無法復原。')){saveRecs([]);go('log')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='task'){e.preventDefault();makePlan(e.target.value)}if(e.key==='Enter'&&e.target.id==='ownStep'){e.preventDefault();$('[data-a="ownok"]')?.click()}});
document.addEventListener('input',e=>{if(e.target.id==='task')draft=e.target.value});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sess.get()){upd();const s=sess.get();if(s&&s.mode!=='done'&&s.left==null)keepAwake(true)}});
setTimeout(()=>{if(sess.get())openFocus()},50);
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur)go(h)});
/* ===== 以下為框架，一般不需修改 ===== */
const VIEWS=GROUPS.flatMap(g=>g.views);let cur='home';const groupOf=v=>GROUPS.find(g=>g.views.includes(v));
function renderTabs(){$('#tabs').innerHTML=GROUPS.map(g=>`<button class="tab" data-tab="${g.k}" aria-current="${groupOf(cur)===g?'page':'false'}"><span class="ti" aria-hidden="true">${g.icon}</span><span>${g.n}</span></button>`).join('')}
function renderTitle(){const g=groupOf(cur);$('#ltTitle').textContent=$('#navTitle').textContent=TITLES[cur];$('#ltSub').textContent=SUBS[cur];$('#ltTag').textContent=g.tag||'';
  $('#subnav').innerHTML=g.sub?`<div class="seg" role="group" aria-label="切換">${g.views.map((v,i)=>`<button data-sub="${v}" aria-pressed="${v===cur}">${g.sub[i]}</button>`).join('')}</div>`:''}
const scrollMem={};let lastY=0;
function go(v){if(!VIEWS.includes(v))v='home';const same=v===cur;if(!same)scrollMem[cur]=scrollY;cur=v;
  $$('.view').forEach(s=>s.hidden=s.id!=='v-'+v);$('#v-'+v).innerHTML=render[v]();renderTabs();renderTitle();
  const y=same?scrollY:(scrollMem[v]||0);lastY=y;scrollTo({top:y});document.body.classList.remove('tabhide');store.set('ax_tab',v);try{history.replaceState(null,'','#'+v)}catch(e){}}
/* 往下捲收起分頁列、往上捲或到底再出現，不擋內容 */
addEventListener('scroll',()=>{const y=scrollY,b=document.body;b.classList.toggle('collapsed',y>42);const end=innerHeight+y>=document.documentElement.scrollHeight-24;
  if(y<80||end||y<lastY-6)b.classList.remove('tabhide');else if(y>lastY+8&&!b.classList.contains('modal-open'))b.classList.add('tabhide');if(Math.abs(y-lastY)>6)lastY=y},{passive:true});

/* ---------- 設定：外觀、動效、震動 ---------- */
function setTheme(v){const r=document.documentElement;r.classList.add('theming');setTimeout(()=>r.classList.remove('theming'),400);v==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',v);store.set('ax_theme',v)}
function openSettings(){const th=store.get('ax_theme','auto'),mo=store.get('ax_motion','full');
  const L=sheet('顯示與設定',`<div class="card"><b>外觀</b><div class="seg">${[['auto','跟隨系統'],['light','淺色'],['dark','深色']].map(([v,n])=>`<button data-th="${v}" aria-pressed="${th===v}">${n}</button>`).join('')}</div>
    <b>動態效果</b><div class="seg">${[['full','完整動效'],['low','簡化動效']].map(([v,n])=>`<button data-mo="${v}" aria-pressed="${mo===v}">${n}</button>`).join('')}</div>
    <label><input type="checkbox" id="hap"${store.get('ax_haptic',true)?' checked':''}> 震動回饋</label><label><input type="checkbox" id="snd"${store.get('s5_sound',true)?' checked':''}> 時間到播放提示音</label></div>${installCta()}`);
  L.addEventListener('click',e=>{const t=e.target.closest('[data-th]');if(t){setTheme(t.dataset.th);L.querySelectorAll('[data-th]').forEach(x=>x.setAttribute('aria-pressed',x===t))}
    const m=e.target.closest('[data-mo]');if(m){store.set('ax_motion',m.dataset.mo);document.documentElement.classList.toggle('lowmo',m.dataset.mo==='low');L.querySelectorAll('[data-mo]').forEach(x=>x.setAttribute('aria-pressed',x===m))}});
  L.addEventListener('change',e=>{if(e.target.id==='hap')store.set('ax_haptic',e.target.checked);if(e.target.id==='snd')store.set('s5_sound',e.target.checked)})}

/* ---------- 加到主畫面 ---------- */
let instEvt=null;const inFrame=(()=>{try{return self!==top}catch(e){return true}})();
const UA=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1),inApp=/\bLine\/|FBAN|FBAV|Instagram|GSA\//i.test(UA);
const canInstall=()=>!inFrame&&!matchMedia('(display-mode: standalone)').matches&&navigator.standalone!==true&&!store.get('ax_inst',0);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;if(cur==='home')go('home')});
addEventListener('appinstalled',()=>{store.set('ax_inst',1);toast('已加到主畫面')});
const installCta=()=>canInstall()?`<button class="btn block" data-act="install">${instEvt?'一鍵安裝到手機主畫面':'加到手機主畫面'}</button>`:'';
async function doInstall(){if(instEvt){instEvt.prompt();const r=await instEvt.userChoice.catch(()=>null);instEvt=null;if(r&&r.outcome==='accepted')store.set('ax_inst',1);go(cur);return}
  sheet('加到主畫面',`<div class="card"><ol>${inApp?'<li>你在 LINE／Facebook 等 App 裡面開啟，請點「⋯」→「在瀏覽器中開啟」。</li><li>在瀏覽器裡再按一次「加到主畫面」。</li>':isIOS?'<li>點 Safari 下方的「分享」（新版在右下「⋯」裡）。</li><li>往下滑，點「加入主畫面」。</li><li>右上角點「新增」。</li>':'<li>點 Chrome 右上角「⋮」。</li><li>點「加到主畫面」或「安裝應用程式」。</li><li>按「安裝」。</li>'}</ol></div>`)}

/* ---------- 版本更新：先列內容再更新；更新後介紹一次 ---------- */
const CHANGES=[
 {"v":"0.1.0","n":"0.1","d":"10 月 30 日","items":[["第一版上線","寫下你在拖延的事，App 幫你找出小到不好意思不做的第一步。","home"],["小火苗陪你專注","按下開始後有 2／5／10 分鐘計時與陪伴角色，時間到想停就停。",null],["火苗罐紀錄","不算連續天數，只累積「開始了幾次」，中斷不會歸零。","log"]]}
],APP_VER=CHANGES[0].v;
function updModal(list,mode){if($('.updm'))return;const top=list[0]||{},items=list.flatMap(c=>c.items).slice(0,6);const m=document.createElement('div');m.className='updm';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML=`<div class="scrim" style="position:absolute;inset:0;background:rgba(6,10,24,.55)"></div><div class="box"><div class="card"><h2>${top.n?`<span>${esc(top.n)}</span>`:''}${mode==='pre'?'更新內容':'已更新到新版'}</h2><ol>${items.map(([t,d])=>`<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join('')}</ol></div>
    ${mode==='pre'?'<button class="btn primary block" data-um="go">立即更新</button><button class="btn block" data-um="later">稍後更新</button>':'<button class="btn primary block" data-um="ok">開始使用</button>'}</div>`;
  m.addEventListener('click',e=>{const b=e.target.closest('[data-um]');if(!b)return;if(b.dataset.um==='go'){store.set('ax_ver',top.v||APP_VER);location.reload()}else m.remove()});document.body.appendChild(m)}
function maybeNews(){const seen=store.get('ax_ver',null);store.set('ax_ver',APP_VER);if(!seen||seen===APP_VER)return;const i=CHANGES.findIndex(c=>c.v===seen);updModal((i<0?CHANGES.slice(0,1):CHANGES.slice(0,i)).slice(0,3),'post')}
window.__showUpdate=async()=>{let list=[];try{const all=await (await fetch('changes.json?t='+Date.now(),{cache:'no-store'})).json();const i=all.findIndex(c=>c.v===APP_VER);list=(i<0?all.slice(0,1):all.slice(0,i)).slice(0,3)}catch(e){}updModal(list,'pre')};
function regSW(){if(!('serviceWorker' in navigator)||inFrame||!(location.protocol==='https:'||location.hostname==='localhost'))return;
  if(navigator.serviceWorker.controller)navigator.serviceWorker.addEventListener('controllerchange',window.__showUpdate);
  const chk=()=>navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});setInterval(chk,20*60e3);
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{})}

/* ---------- 事件分派：所有按鈕用 data-* ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){const g=GROUPS.find(x=>x.k===t.dataset.tab);buzz();return go(g.views[0])}
  if(t.dataset.sub)return go(t.dataset.sub);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.id==='setBtn')return openSettings();
  if(t.dataset.act==='install')return doInstall();
});
/* ---------- 啟動 ---------- */
{const th=store.get('ax_theme','auto');if(th!=='auto')document.documentElement.setAttribute('data-theme',th);document.documentElement.classList.toggle('lowmo',store.get('ax_motion','full')==='low')}
const h=location.hash.slice(1);go(VIEWS.includes(h)?h:store.get('ax_tab','home'));setTimeout(maybeNews,600);setTimeout(regSW,1500);
})();
</script>
