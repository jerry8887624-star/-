<!doctype html><meta charset="utf-8"><base href="/nest/"><body style="margin:0;background:#0000">
<script type="module">
import * as THREE from '/nest/vendor/three.module.min.js';
import { load, cloneModel } from '/nest/js/models.js';
import { DECOR } from '/nest/js/data.js';
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.setSize(256, 256); R.setClearColor(0x000000, 0); R.outputColorSpace = THREE.SRGBColorSpace;

</script>
